# vroom-express configuration template (PLAT-2, decision 2.5; ADR-0010).
# compose.yaml renders it to /conf/config.yml at container start, replacing
# __OSRM_HOST__ and __OSRM_PORT__ with OSRM_HOST and OSRM_PORT. OSRM is not
# part of wave 0 (INT-5, roadmap A-1), so both stay unset and route requests
# fail until it exists; the health check only proves that VROOM starts.
cliArgs:
  geometry: false
  planmode: false
  threads: 4
  explore: 5
  limit: '1mb'
  logdir: '/..'
  logsize: '100M'
  maxlocations: 1000
  maxvehicles: 200
  override: true
  path: ''
  port: 3000
  router: 'osrm'
  timeout: 300000
  baseurl: '/'
routingServers:
  osrm:
    car:
      host: '__OSRM_HOST__'
      port: '__OSRM_PORT__'
