# Pull request checks (PLAT-3; platform §4, handbook 03 "CI gates per PR").
# Each check is its own job so it reports its own status; the seven required ones are
# typecheck-lint, api-test, api-test-rls, web-build-census, admin-build-census, driver-test and
# gitleaks.
# main.yml calls this workflow on every push to main before it builds the images.
# A docs-only pull request (.github/actions/changes) skips the build and test lanes; typecheck-lint
# then runs Prettier only and gitleaks runs as always. tools/pr-gate.sh accepts skipped checks.
name: pr

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # One run per pull request, the newest wins. On main (called from main.yml) every
  # commit gets its own group, so no merge is cancelled.
  group: pr-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
  # The pre-commit hook is for laptops; a runner never commits.
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            tools
      - id: changes
        uses: ./.github/actions/changes

  typecheck-lint:
    name: typecheck-lint
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-scope: typecheck-lint
      # Every workspace; lint includes the contracts Redocly lint (packages/contracts).
      - name: Typecheck and lint every workspace
        if: needs.changes.outputs.code == 'true'
        run: pnpm turbo run typecheck lint
      # PLAT-15 plan 2.6: generated/ is not committed, so determinism is asserted by hashing two
      # fresh generations (the script, not turbo, so a cache hit cannot stand in for a run).
      - name: Contracts generate twice and compare
        if: needs.changes.outputs.code == 'true'
        run: |
          digest() {
            local count
            count=$(find packages/contracts/generated -type f | wc -l)
            [ "$count" -gt 0 ] || {
              echo "::error::Contracts generate twice and compare: packages/contracts/generated is empty" >&2
              return 1
            }
            echo "files: $count" >&2
            (cd packages/contracts/generated && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum) | sha256sum
          }
          rm -rf packages/contracts/generated
          pnpm --filter @eeasy-logistics/contracts run build > /dev/null
          first=$(digest) || exit 1
          rm -rf packages/contracts/generated
          pnpm --filter @eeasy-logistics/contracts run build > /dev/null
          second=$(digest) || exit 1
          echo "first:  $first"
          echo "second: $second"
          [ "$first" = "$second" ] || {
            echo "::error::two generations of packages/contracts/generated differ; the generator is not deterministic"
            exit 1
          }
      - name: Prettier
        run: |
          pnpm format:check || {
            echo "::error::files above are not Prettier-formatted; run pnpm format and commit"
            exit 1
          }

  # Unit, integration and architecture tests against the Compose ci profile (decision 2.3).
  # api-test-rls repeats the suite with row-level security switched on (A-6; data §4.5).
  api-test:
    name: ${{ matrix.lane }}
    # Step-level skips, not a job-level if: a skipped matrix job reports under the unexpanded
    # name, which would leave the required api-test and api-test-rls checks waiting forever.
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: api-test
            rls: 'off'
          - lane: api-test-rls
            rls: 'on'
    env:
      COMPOSE_PROJECT_NAME: elx-ci
      APP_ENV: ci
      ELX_RLS: ${{ matrix.rls }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: needs.changes.outputs.code == 'true'
        with:
          cache-scope: ${{ matrix.lane }}
      - name: Start the ci profile and wait for healthy
        if: needs.changes.outputs.code == 'true'
        run: |
          cp .env.example .env
          docker compose --profile ci up --detach --wait --wait-timeout 300 || {
            echo "::error::the Compose ci profile did not become healthy (service logs in the last step)"
            exit 1
          }
          docker compose --profile ci ps --format '{{.Service}} {{.State}} {{.Health}} {{.Publishers}}'
      # APP_ENV=ci never reads .env (packages/config), and the ci profile publishes random host
      # ports, so the API's variables are built here from .env's local passwords and the ports.
      # No DATABASE_URL_ADMIN: the suite then uses the migrated ci database itself (PLAT-5 2.9).
      - name: Point the API at the ci services
        if: needs.changes.outputs.code == 'true'
        run: |
          set -a; . ./.env; set +a
          port() { docker compose --profile ci port "$1" "$2"; }
          pg=$(port postgres-ci 5432)
          {
            echo "DATABASE_URL_OWNER=postgres://elx_owner:${ELX_OWNER_PASSWORD}@${pg}/elx"
            echo "DATABASE_URL_APP=postgres://elx_app:${ELX_APP_PASSWORD}@${pg}/elx"
            echo "DATABASE_URL_PLATFORM=postgres://elx_platform:${ELX_PLATFORM_PASSWORD}@${pg}/elx"
            echo "DATABASE_URL_MAINTENANCE=postgres://elx_maintenance:${ELX_MAINTENANCE_PASSWORD}@${pg}/elx"
            echo "REDIS_URL=redis://$(port redis-ci 6379)"
            echo "STORAGE_ENDPOINT=http://$(port minio-ci 9000)"
            echo "STORAGE_BUCKET=${MINIO_BUCKET}"
            echo "STORAGE_ACCESS_KEY_ID=${MINIO_ROOT_USER}"
            echo "STORAGE_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}"
          } >> "$GITHUB_ENV"
      # The API imports the generated operation schemas (PLAT-6 item I, A-17); built before the
      # API's own build so every role starts from a complete tree (PLAT-7: the migrate role no
      # longer loads them, rule migrate-job-loads-no-application, but the api role does).
      - name: Build the contracts
        if: needs.changes.outputs.code == 'true'
        run: pnpm --filter @eeasy-logistics/contracts run build
      - name: Migrate from zero
        if: needs.changes.outputs.code == 'true'
        run: pnpm --filter @eeasy-logistics/api run migrate
      # ci seeds on every run (data §11.6): the deterministic fixtures, idempotent.
      - name: Seed the fixtures
        if: needs.changes.outputs.code == 'true'
        run: pnpm --filter @eeasy-logistics/api run seed
      - name: Unit tests
        if: needs.changes.outputs.code == 'true'
        run: pnpm --filter @eeasy-logistics/api run test:unit
      - name: Integration tests (ELX_RLS=${{ matrix.rls }})
        if: needs.changes.outputs.code == 'true'
        run: pnpm --filter @eeasy-logistics/api run test:integration
      - name: Architecture test
        if: needs.changes.outputs.code == 'true'
        run: pnpm --filter @eeasy-logistics/api run test:architecture
      - name: Service logs on failure
        if: needs.changes.outputs.code == 'true' && (failure())
        run: docker compose --profile ci logs --no-color --tail 200 || true
      - name: Stop the ci profile
        if: needs.changes.outputs.code == 'true' && (always())
        run: docker compose --profile ci down --volumes --remove-orphans || true

  # Standalone web build and its first-load budget, the API and the web server against the Compose
  # ci profile, then the census in ar and en with screenshots as artifacts (decision 2.4; web §11,
  # §10.2; WEB-1 plan 2.9, 2.10).
  web-build-census:
    name: web-build-census
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: elx-ci
      APP_ENV: ci
      # PLAT-14 plan 2.9: the census build's public values (tests/census/helpers.ts censusBuild):
      # the fault routes of a ci build, Sentry and PostHog pointed at .invalid hosts (nothing
      # leaves the runner; the census intercepts /monitoring and /ingest in the browser).
      NEXT_PUBLIC_APP_ENV: ci
      NEXT_PUBLIC_RELEASE: census
      NEXT_PUBLIC_SENTRY_DSN: https://census@sentry.invalid/1
      NEXT_PUBLIC_POSTHOG_KEY: phc_census
      NEXT_PUBLIC_POSTHOG_HOST: https://posthog.invalid
      # The ports of .env.example; tests/census.config.ts expects the web app on 3001.
      API_PORT: '3000'
      WEB_PORT: '3001'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-scope: web-build-census
      - name: Restore the Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Start the ci profile and wait for healthy
        run: |
          cp .env.example .env
          docker compose --profile ci up --detach --wait --wait-timeout 300 || {
            echo "::error::the Compose ci profile did not become healthy (service logs in the last steps)"
            exit 1
          }
      - name: Build the API and the standalone web app
        run: pnpm turbo run build --filter=@eeasy-logistics/api --filter=@eeasy-logistics/web
      # WEB-1 plan 2.10 (web §10.2): fails when a route's first-load JavaScript (gzip) is over its
      # class budget (recipient 90 KB, merchant and platform 180 KB); prints every route's size.
      - name: First-load JavaScript budget
        run: pnpm --filter @eeasy-logistics/web run check:budget
      - name: Start the API and wait for /health
        run: |
          PORT="$API_PORT" nohup node apps/api/dist/main.js --role api > api.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS "http://127.0.0.1:$API_PORT/health" && echo && exit 0
            sleep 1
          done
          echo "::error::the API did not answer /health on port $API_PORT within 60 s (api.log in the artifact)"
          exit 1
      # PLAT-15 plan 2.8, 2.10: the harness self-test plus every scenario of test/scenarios against
      # the running API; prints the advisory coverage table.
      - name: Contract tests against the API
        run: pnpm --filter @eeasy-logistics/contracts run test:contract -- --api "http://127.0.0.1:$API_PORT"
      - name: Start the standalone web server and wait for /
        run: |
          standalone=apps/web/.next/standalone/apps/web
          test -f "$standalone/server.js" || {
            echo "::error::no standalone output; is output: 'standalone' still in apps/web/next.config.ts?"
            exit 1
          }
          cp -R apps/web/.next/static "$standalone/.next/static"
          PORT="$WEB_PORT" HOSTNAME=127.0.0.1 nohup node "$standalone/server.js" > web.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null "http://127.0.0.1:$WEB_PORT/" && exit 0
            sleep 1
          done
          echo "::error::the web server did not answer / on port $WEB_PORT within 60 s (web.log in the artifact)"
          exit 1
      - name: Install Chromium for Playwright
        run: pnpm --filter @eeasy-logistics/web exec playwright install --with-deps chromium
      # WEB-1 plan 2.9: the census (projects ar at 1440 and 390 px, en at 1440 px) with the locale,
      # axe and security assertions and the screenshot baselines of tests/census/__screenshots__.
      - name: Census in ar and en
        run: pnpm --filter @eeasy-logistics/web run test:census
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-build-census
          path: |
            apps/web/test-results/
            api.log
            web.log
          if-no-files-found: warn
          retention-days: 14
      - name: Service logs on failure
        if: failure()
        run: docker compose --profile ci logs --no-color --tail 200 || true
      - name: Stop the ci profile
        if: always()
        run: docker compose --profile ci down --volumes --remove-orphans || true

  # The platform console (ADR-0038; WEB-19 decision 2.8): the same lane as web-build-census for
  # apps/admin, its standalone server on 3002 beside the API on 3000. The contract tests run in
  # web-build-census only.
  admin-build-census:
    name: admin-build-census
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: elx-ci
      APP_ENV: ci
      # PLAT-14 plan 2.9: the census build's public values (tests/census/helpers.ts censusBuild):
      # the fault routes of a ci build, Sentry and PostHog pointed at .invalid hosts (nothing
      # leaves the runner; the census intercepts /monitoring and /ingest in the browser).
      NEXT_PUBLIC_APP_ENV: ci
      NEXT_PUBLIC_RELEASE: census
      NEXT_PUBLIC_SENTRY_DSN: https://census@sentry.invalid/1
      NEXT_PUBLIC_POSTHOG_KEY: phc_census
      NEXT_PUBLIC_POSTHOG_HOST: https://posthog.invalid
      # The ports of .env.example; tests/census.config.ts expects the admin app on 3002.
      API_PORT: '3000'
      ADMIN_PORT: '3002'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-scope: admin-build-census
      - name: Restore the Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/admin/.next/cache
          key: next-admin-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-admin-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Start the ci profile and wait for healthy
        run: |
          cp .env.example .env
          docker compose --profile ci up --detach --wait --wait-timeout 300 || {
            echo "::error::the Compose ci profile did not become healthy (service logs in the last steps)"
            exit 1
          }
      - name: Build the API and the standalone admin app
        run: pnpm turbo run build --filter=@eeasy-logistics/api --filter=@eeasy-logistics/admin
      # WEB-1 plan 2.10 (web §10.2): fails when a route's first-load JavaScript (gzip) is over its
      # class budget (recipient 90 KB, merchant and platform 180 KB); prints every route's size.
      - name: First-load JavaScript budget
        run: pnpm --filter @eeasy-logistics/admin run check:budget
      - name: Start the API and wait for /health
        run: |
          PORT="$API_PORT" nohup node apps/api/dist/main.js --role api > api.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS "http://127.0.0.1:$API_PORT/health" && echo && exit 0
            sleep 1
          done
          echo "::error::the API did not answer /health on port $API_PORT within 60 s (api.log in the artifact)"
          exit 1
      - name: Start the standalone admin server and wait for /
        run: |
          standalone=apps/admin/.next/standalone/apps/admin
          test -f "$standalone/server.js" || {
            echo "::error::no standalone output; is output: 'standalone' still in apps/admin/next.config.ts?"
            exit 1
          }
          cp -R apps/admin/.next/static "$standalone/.next/static"
          PORT="$ADMIN_PORT" HOSTNAME=127.0.0.1 nohup node "$standalone/server.js" > admin.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null "http://127.0.0.1:$ADMIN_PORT/" && exit 0
            sleep 1
          done
          echo "::error::the admin server did not answer / on port $ADMIN_PORT within 60 s (admin.log in the artifact)"
          exit 1
      - name: Install Chromium for Playwright
        run: pnpm --filter @eeasy-logistics/admin exec playwright install --with-deps chromium
      # WEB-1 plan 2.9 (leg 2): the same census harness as apps/web (projects ar at 1440 and 390 px,
      # en at 1440 px) with the baselines of apps/admin/tests/census/__screenshots__.
      - name: Census in ar and en
        run: pnpm --filter @eeasy-logistics/admin run test:census
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-build-census
          path: |
            apps/admin/test-results/
            api.log
            admin.log
          if-no-files-found: warn
          retention-days: 14
      - name: Service logs on failure
        if: failure()
        run: docker compose --profile ci logs --no-color --tail 200 || true
      - name: Stop the ci profile
        if: always()
        run: docker compose --profile ci down --volumes --remove-orphans || true

  driver-test:
    name: driver-test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-scope: driver-test
      # Typecheck and unit only (driver app §12.1); Maestro is DRV-6's, EAS builds DRV-1's.
      - name: Typecheck, lint and Jest
        run: pnpm turbo run typecheck lint test --filter=@eeasy-logistics/driver
      - name: expo-doctor
        run: pnpm --filter @eeasy-logistics/driver run doctor

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The official gitleaks release binary, checksum-pinned. gitleaks-action needs a
      # licence key for organisation repositories and none is configured (plan §8).
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      # The whole history, every run: a secret committed and later deleted is still a leak.
      # The repository's .gitleaks.toml is picked up from the checkout root.
      - name: Scan the full history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner . || {
            echo "::error::gitleaks found a secret (findings above, redacted). Remove it from history and rotate it."
            exit 1
          }
