# Compose smoke test (PLAT-2 decision 2.8): checks the PLAT-2 exit criteria on
# a runner with Docker, because the executor machine has none. PLAT-3
# replaces it with the full CI lanes.
name: compose-smoke

on:
  pull_request:
    paths:
      - compose.yaml
      - .env.example
      - 'tools/**'
      - .github/workflows/compose-smoke.yml

permissions:
  contents: read

concurrency:
  group: compose-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # The ci profile runs under its own project name (README "Running the stack").
  COMPOSE_PROJECT_NAME: elx-ci

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Tool versions
        run: |
          docker version --format 'docker {{.Server.Version}}'
          docker compose version
          node --version

      - name: Use the example environment
        run: cp .env.example .env

      - name: WhatsApp stub unit tests
        run: node --test tools/whatsapp-stub/server.test.mjs

      - name: Start the ci profile and wait for healthy
        run: docker compose --profile ci up --detach --wait --wait-timeout 300

      - name: Every ci service is running and healthy
        run: |
          docker compose --profile ci ps --all --format '{{.Service}} {{.State}} {{.Health}}' | sort | tee ps.txt
          test "$(wc -l < ps.txt)" -eq 7 || { echo "::error::expected 7 ci services"; exit 1; }
          if grep -v ' running healthy$' ps.txt; then
            echo "::error::the services above are not running and healthy"
            exit 1
          fi

      - name: ci has no fixed host ports and keeps data on tmpfs
        run: |
          docker compose --profile ci config --format json > ci-config.json
          fixed=$(jq -r '.services[] | select(.profiles == ["ci"]) | .ports[]? | select((.published // "") != "") | .published' ci-config.json)
          if [ -n "$fixed" ]; then echo "::error::fixed host ports in ci: $fixed"; exit 1; fi
          for service in postgres-ci redis-ci minio-ci; do
            id=$(docker compose --profile ci ps --quiet "$service")
            tmpfs=$(docker inspect --format '{{json .HostConfig.Tmpfs}}' "$id")
            mounts=$(docker inspect --format '{{range .Mounts}}{{.Type}}:{{.Destination}} {{end}}' "$id")
            echo "$service tmpfs=$tmpfs mounts=$mounts"
            [ "$tmpfs" != "null" ] || { echo "::error::$service has no tmpfs"; exit 1; }
            if grep -q 'volume:' <<< "$mounts"; then echo "::error::$service has a volume"; exit 1; fi
          done
          echo "postgres-ci published on $(docker compose --profile ci port postgres-ci 5432)"

      - name: Four roles and three extensions
        run: |
          set -a; . ./.env; set +a
          sql() { docker compose --profile ci exec -T postgres-ci psql -U postgres -d "$1" -tAc "$2"; }
          roles=$(sql elx "SELECT string_agg(rolname, ',' ORDER BY rolname) FROM pg_roles WHERE rolname LIKE 'elx\_%'")
          echo "roles: $roles"
          [ "$roles" = "elx_app,elx_maintenance,elx_owner,elx_platform" ]
          privileged=$(sql elx "SELECT count(*) FROM pg_roles WHERE rolname LIKE 'elx\_%' AND (rolsuper OR rolbypassrls OR rolcreaterole OR rolcreatedb)")
          echo "privileged elx roles: $privileged"
          [ "$privileged" = "0" ]
          owner=$(sql elx "SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname = 'elx'")
          echo "owner of elx: $owner"
          [ "$owner" = "elx_owner" ]
          for db in elx template1; do
            extensions=$(sql "$db" "SELECT string_agg(extname, ',' ORDER BY extname) FROM pg_extension WHERE extname <> 'plpgsql'")
            echo "extensions in $db: $extensions"
            [ "$extensions" = "citext,pgcrypto,postgis" ]
          done
          for role in elx_owner elx_app elx_platform elx_maintenance; do
            var="ELX_${role#elx_}_PASSWORD"; var=${var^^}
            who=$(docker compose --profile ci exec -T -e PGPASSWORD="${!var}" postgres-ci \
              psql -h 127.0.0.1 -U "$role" -d elx -tAc 'SELECT current_user')
            echo "password login as $role: $who"
            [ "$who" = "$role" ]
          done

      - name: Redis and VROOM answer
        run: |
          [ "$(docker compose --profile ci exec -T redis-ci redis-cli ping)" = "PONG" ]
          curl -fsS -o /dev/null -w 'vroom /health %{http_code}\n' "http://$(docker compose --profile ci port vroom-ci 3000)/health"

      - name: WhatsApp stub records a POST and lists it
        run: |
          stub=$(docker compose --profile ci port whatsapp-stub-ci 8080)
          marker="smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl -fsS -X POST "http://$stub/v1/messages" -H 'content-type: application/json' \
            -d "{\"to\":\"+966500000000\",\"text\":\"$marker\"}"
          echo
          curl -fsS "http://$stub/sent" | tee sent.json
          echo
          jq -e --arg m "$marker" 'any(.[]; .body.text == $m)' sent.json

      - name: MinIO bucket exists with versioning enabled
        run: |
          mc() { docker compose --profile ci exec -T minio-init-ci mc "$@"; }
          mc ls local | tee ls.txt
          grep -q 'elx-local/' ls.txt
          mc version info local/elx-local | tee version.txt
          grep -qi 'versioning is enabled' version.txt
          echo one | mc pipe local/elx-local/smoke.txt
          echo two | mc pipe local/elx-local/smoke.txt
          mc ls --versions local/elx-local/smoke.txt | tee versions.txt
          [ "$(wc -l < versions.txt)" -eq 2 ]

      - name: Mailpit is reachable and receives mail
        run: |
          ui=$(docker compose --profile ci port mailpit-ci 8025)
          smtp=$(docker compose --profile ci port mailpit-ci 1025)
          curl -fsS "http://$ui/api/v1/info" | jq -e '.Version'
          printf 'From: smoke@elx.test\r\nTo: owner@elx.test\r\nSubject: compose smoke\r\n\r\nhello\r\n' > mail.txt
          curl -fsS --url "smtp://$smtp" --mail-from smoke@elx.test --mail-rcpt owner@elx.test --upload-file mail.txt
          curl -fsS "http://$ui/api/v1/messages" | jq -e '.total >= 1'

      - name: Stop the ci profile
        run: docker compose --profile ci down --volumes --remove-orphans

      - name: Start stack-a and stack-b concurrently
        run: |
          tools/stack.sh up a > stack-a.log 2>&1 & pid_a=$!
          tools/stack.sh up b > stack-b.log 2>&1 & pid_b=$!
          status_a=0; wait "$pid_a" || status_a=$?
          status_b=0; wait "$pid_b" || status_b=$?
          echo '--- stack-a'; cat stack-a.log
          echo '--- stack-b'; cat stack-b.log
          [ "$status_a" -eq 0 ] && [ "$status_b" -eq 0 ]

      - name: Both stacks are healthy and answer on their own ports
        run: |
          for s in a b; do
            docker compose --project-name "elx-stack-$s" --profile "stack-$s" ps --all \
              --format '{{.Service}} {{.State}} {{.Health}}' | sort | tee "ps-$s.txt"
            test "$(wc -l < "ps-$s.txt")" -eq 7
            if grep -v ' running healthy$' "ps-$s.txt"; then echo "::error::stack-$s unhealthy"; exit 1; fi
          done
          check() { # stack offset
            local o=$2
            curl -fsS -o /dev/null "http://127.0.0.1:$((3030 + o))/health"
            curl -fsS -o /dev/null "http://127.0.0.1:$((9000 + o))/minio/health/live"
            curl -fsS -o /dev/null "http://127.0.0.1:$((8025 + o))/api/v1/info"
            curl -fsS -o /dev/null "http://127.0.0.1:$((8080 + o))/health"
            timeout 5 bash -c "</dev/tcp/127.0.0.1/$((5432 + o))"
            timeout 5 bash -c "</dev/tcp/127.0.0.1/$((6379 + o))"
            echo "stack-$1 answers on postgres $((5432 + o)), redis $((6379 + o)), vroom $((3030 + o)), minio $((9000 + o)), mailpit $((8025 + o)), stub $((8080 + o))"
          }
          check a 100
          check b 200
          # The two stubs are separate processes: a send to a is not listed by b.
          curl -fsS -X POST http://127.0.0.1:8180/v1/messages -H 'content-type: application/json' -d '{"to":"a"}'
          echo
          [ "$(curl -fsS http://127.0.0.1:8180/sent | jq length)" -eq 1 ]
          [ "$(curl -fsS http://127.0.0.1:8280/sent | jq length)" -eq 0 ]

      - name: Stacks have separate volumes and clone their own database
        run: |
          set -a; . ./.env; set +a
          va=$(docker volume ls --quiet --filter label=com.docker.compose.project=elx-stack-a | sort)
          vb=$(docker volume ls --quiet --filter label=com.docker.compose.project=elx-stack-b | sort)
          echo "stack-a volumes: $va"; echo "stack-b volumes: $vb"
          [ -n "$va" ] && [ -n "$vb" ]
          [ -z "$(comm -12 <(echo "$va") <(echo "$vb"))" ]
          for s in a b; do
            tools/stack.sh clone "$s"
            extensions=$(docker compose --project-name "elx-stack-$s" --profile "stack-$s" exec -T "postgres-$s" \
              psql -U postgres -d "elx_stack_$s" -tAc "SELECT string_agg(extname, ',' ORDER BY extname) FROM pg_extension WHERE extname <> 'plpgsql'")
            echo "elx_stack_$s extensions: $extensions"
            [ "$extensions" = "citext,pgcrypto,postgis" ]
          done

      - name: Service logs on failure
        if: failure()
        run: |
          docker compose --profile ci logs --no-color --tail 200 || true
          for s in a b; do
            docker compose --project-name "elx-stack-$s" --profile "stack-$s" logs --no-color --tail 200 || true
          done

      - name: Tear down every project
        if: always()
        run: |
          docker compose --profile ci down --volumes --remove-orphans || true
          tools/stack.sh down a || true
          tools/stack.sh down b || true
          docker ps --all --filter label=com.docker.compose.project --format '{{.Names}}'
