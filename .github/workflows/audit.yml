# Dependency vulnerability audit (supply-chain hardening, 2026-11-01). Fails on any moderate or
# worse advisory in the lockfile that pnpm-workspace.yaml does not list as accepted. Runs on
# every pull request and weekly on main, so an advisory published after a merge still surfaces.
name: audit

on:
  pull_request:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pnpm-audit:
    name: pnpm-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Reads the lockfile only; no install is needed.
      - name: Audit every workspace
        run: pnpm audit --audit-level moderate
