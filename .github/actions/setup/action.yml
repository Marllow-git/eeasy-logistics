# Shared job setup (PLAT-3 decision 2.2): pnpm from package.json "packageManager",
# Node with the pnpm store cached, the Turborepo local cache kept in the GitHub
# Actions cache (no Vercel Remote Cache token exists), then a frozen install.
# node_modules is never cached as a whole.
name: setup
description: pnpm, Node, pnpm store and Turborepo caches, frozen install

inputs:
  node-version:
    description: Node version; empty means .nvmrc
    required: false
    default: ''
  cache-scope:
    description: Keeps one job's Turborepo cache apart from another's
    required: true

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && '.nvmrc' || '' }}
        cache: pnpm

    - name: Restore the Turborepo cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ inputs.cache-scope }}-${{ inputs.node-version || 'nvmrc' }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ inputs.cache-scope }}-${{ inputs.node-version || 'nvmrc' }}-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
