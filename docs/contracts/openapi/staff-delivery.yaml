openapi: 3.1.0
info:
  title: "eeasy-logistics staff API: Delivery"
  version: 1.0.0
  license: {name: Proprietary, identifier: LicenseRef-Proprietary}
  description: >-
    The web app surface for merchant staff, Delivery part (waves 1 and 2): zones, coverage, drivers,
    vehicles, shifts, orders, imports, dispatch, slots, proofs, cash custody, tracking tokens and the
    dispatch SSE stream. Same base path and session as staff.yaml (ADR-0026 split by context).
    Conventions, errors and waves: docs/contracts/README.md and errors.md.
servers:
  - url: /v1/staff
security:
  - staffCookie: []
tags:
  - {name: zones, description: "Zones (document 2 §3.4)"}
  - {name: coverage, description: "Coverage (ADR-0015)"}
  - {name: drivers, description: "Drivers and devices"}
  - {name: vehicles, description: "Vehicles"}
  - {name: shifts, description: "Driver shifts (§3.17)"}
  - {name: locations, description: "Driver positions (ADR-0028)"}
  - {name: orders, description: "Orders (§3.1, §3.13)"}
  - {name: order-imports, description: "CSV import jobs"}
  - {name: dispatch, description: "Offers and assignments"}
  - {name: slots, description: "Slots (§3.9)"}
  - {name: proofs, description: "Proofs (§3.10)"}
  - {name: cash, description: "COD, custody, handovers, deposits, reports (ADR-0007)"}
  - {name: tracking, description: "Recipient tracking tokens (§3.12)"}
  - {name: streams, description: "Server-sent events (ADR-0009)"}
paths:
  /zones:
    get:
      operationId: listZones
      summary: "List zones"
      tags: [zones]
      x-wave: 1
      x-permission: delivery.zones.read
      security: [{staffCookie: []}]
      parameters: [{name: active, in: query, schema: {type: boolean}}, {$ref: './components.yaml#/components/parameters/Q'}, {$ref: './components.yaml#/components/parameters/Cursor'}, {$ref: './components.yaml#/components/parameters/Limit'}, {$ref: './components.yaml#/components/parameters/Sort'}]
      responses:
        '200': {description: A page, content: {application/json: {schema: {allOf: [{$ref: './components.yaml#/components/schemas/Page'}, {type: object, properties: {data: {type: array, items: {$ref: './components.yaml#/components/schemas/Zone'}}}}]}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
    post:
      operationId: createZone
      summary: "Create a zone from an official boundary or a drawn polygon"
      tags: [zones]
      x-wave: 1
      x-permission: delivery.zones.manage
      security: [{staffCookie: []}]
      parameters: [{$ref: './components.yaml#/components/parameters/IdempotencyKey'}, {$ref: './components.yaml#/components/parameters/ElClient'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Zone'}}}}
      responses:
        '201': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Zone'}}}}
        '400': {$ref: './components.yaml#/components/responses/BadRequest', description: 'Codes: validation_failed.'}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /zones/{zone_id}:
    get:
      operationId: getZone
      summary: "Get a zone with its boundary"
      tags: [zones]
      x-wave: 1
      x-permission: delivery.zones.read
      security: [{staffCookie: []}]
      parameters: [{name: zone_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Zone'}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
    patch:
      operationId: updateZone
      summary: "Change a zone"
      tags: [zones]
      x-wave: 1
      x-permission: delivery.zones.manage
      security: [{staffCookie: []}]
      parameters: [{name: zone_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}, {$ref: './components.yaml#/components/parameters/ElClient'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Zone'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Zone'}}}}
        '400': {$ref: './components.yaml#/components/responses/BadRequest', description: 'Codes: validation_failed.'}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /coverage:
    get:
      operationId: listCoverage
      summary: "List (site, zone) coverage rows"
      tags: [coverage]
      x-wave: 1
      x-permission: delivery.zones.read
      security: [{staffCookie: []}]
      parameters: [{$ref: './components.yaml#/components/parameters/SiteIdQuery'}, {$ref: './components.yaml#/components/parameters/Cursor'}, {$ref: './components.yaml#/components/parameters/Limit'}, {$ref: './components.yaml#/components/parameters/Sort'}]
      responses:
        '200': {description: A page, content: {application/json: {schema: {allOf: [{$ref: './components.yaml#/components/schemas/Page'}, {type: object, properties: {data: {type: array, items: {$ref: './components.yaml#/components/schemas/Coverage'}}}}]}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /sites/{site_id}/coverage:
    put:
      operationId: replaceSiteCoverage
      summary: "Replace the zones a site covers"
      description: 'Created first by the provisioning door (ADR-0015); later edits are audited. K-4: branch or both only.'
      tags: [coverage]
      x-wave: 1
      x-permission: delivery.coverage.manage
      security: [{staffCookie: []}]
      parameters: [{name: site_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}, {$ref: './components.yaml#/components/parameters/ElClient'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SiteCoverageRequest'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/SiteCoverage'}}}}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: site_kind_mismatch, idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /coverage/check:
    post:
      operationId: checkCoverage
      summary: "Resolve an address to a zone and the sites that cover it"
      description: 'Read-only computation; no Idempotency-Key.'
      tags: [coverage]
      x-wave: 1
      x-permission: delivery.orders.read
      security: [{staffCookie: []}]
      parameters: [{$ref: './components.yaml#/components/parameters/ElClient'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CoverageCheckRequest'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/CoverageCheck'}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /drivers:
    get:
      operationId: listDrivers
      summary: "List drivers"
      tags: [drivers]
      x-wave: 1
      x-permission: delivery.drivers.read
      security: [{staffCookie: []}]
      parameters: [{$ref: './components.yaml#/components/parameters/StatusQuery'}, {$ref: './components.yaml#/components/parameters/SiteIdQuery'}, {name: cash_blocked, in: query, schema: {type: boolean}}, {$ref: './components.yaml#/components/parameters/Q'}, {$ref: './components.yaml#/components/parameters/Cursor'}, {$ref: './components.yaml#/components/parameters/Limit'}, {$ref: './components.yaml#/components/parameters/Sort'}]
      responses:
        '200': {description: A page, content: {application/json: {schema: {allOf: [{$ref: './components.yaml#/components/schemas/Page'}, {type: object, properties: {data: {type: array, items: {$ref: './components.yaml#/components/schemas/Driver'}}}}]}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
    post:
      operationId: createDriver
      summary: "Create a driver and send the app invitation over WhatsApp"
      description: 'Creates the user, a driver membership and the del_drivers row. Refused with role_combination_forbidden when the phone already belongs to a member of this account holding a cash permission.'
      tags: [drivers]
      x-wave: 1
      x-permission: delivery.drivers.manage
      security: [{staffCookie: []}]
      parameters: [{$ref: './components.yaml#/components/parameters/IdempotencyKey'}, {$ref: './components.yaml#/components/parameters/ElClient'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateDriverRequest'}}}}
      responses:
        '201': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Driver'}}}}
        '400': {$ref: './components.yaml#/components/responses/BadRequest', description: 'Codes: validation_failed.'}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: limit_exceeded, site_kind_mismatch, idempotency_key_reused, role_combination_forbidden.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /drivers/{driver_id}:
    get:
      operationId: getDriver
      summary: "Get a driver"
      tags: [drivers]
      x-wave: 1
      x-permission: delivery.drivers.read
      security: [{staffCookie: []}]
      parameters: [{name: driver_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Driver'}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
    patch:
      operationId: updateDriver
      summary: "Change a driver (home site, status, capacity limit)"
      tags: [drivers]
      x-wave: 1
      x-permission: delivery.drivers.manage
      security: [{staffCookie: []}]
      parameters: [{name: driver_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}, {$ref: './components.yaml#/components/parameters/ElClient'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateDriverRequest'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Driver'}}}}
        '400': {$ref: './components.yaml#/components/responses/BadRequest', description: 'Codes: validation_failed.'}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: capacity_exceeded, idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /drivers/{driver_id}/devices:
    get:
      operationId: listDriverDevices
      summary: "List a driver devices"
      tags: [drivers]
      x-wave: 1
      x-permission: delivery.drivers.read
      security: [{staffCookie: []}]
      parameters: [{name: driver_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/Cursor'}, {$ref: './components.yaml#/components/parameters/Limit'}, {$ref: './components.yaml#/components/parameters/Sort'}]
      responses:
        '200': {description: A page, content: {application/json: {schema: {allOf: [{$ref: './components.yaml#/components/schemas/Page'}, {type: object, properties: {data: {type: array, items: {$ref: './components.yaml#/components/schemas/DriverDevice'}}}}]}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /drivers/{driver_id}/devices/{device_id}/revoke:
    post:
      operationId: revokeDriverDevice
      summary: "Revoke a driver device and its refresh tokens"
      description: 'Access ends within one access-token lifetime (document 4 §9).'
      tags: [drivers]
      x-wave: 1
      x-permission: delivery.drivers.manage
      security: [{staffCookie: []}]
      parameters: [{name: driver_id, in: path, required: true, schema: {type: string, format: uuid}}, {name: device_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}, {$ref: './components.yaml#/components/parameters/ElClient'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/DriverDevice'}}}}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /drivers/{driver_id}/cash-pin/reset:
    post:
      operationId: resetDriverCashPin
      summary: "Unlock and reset a driver cash PIN"
      description: 'After five failures cash actions stay locked until this reset (document 4 §3.2). Audited.'
      tags: [drivers]
      x-wave: 1
      x-permission: delivery.drivers.manage
      security: [{staffCookie: []}]
      parameters: [{name: driver_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}, {$ref: './components.yaml#/components/parameters/ElClient'}]
      responses:
        '204': {description: Done}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /drivers/{driver_id}/clear-cash-block:
    post:
      operationId: clearDriverCashBlock
      summary: "Clear a cash block after review"
      description: 'D-11: supervisor clearance with an audit row.'
      tags: [cash]
      x-wave: 2
      x-permission: delivery.drivers.clear_cash_block
      security: [{staffCookie: []}]
      parameters: [{name: driver_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}, {$ref: './components.yaml#/components/parameters/ElClient'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NoteRequest'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Driver'}}}}
        '409': {$ref: './components.yaml#/components/responses/Conflict', description: 'Codes: invalid_transition.'}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /drivers/{driver_id}/cash:
    get:
      operationId: getDriverCash
      summary: "Cash in hand, liability balance and block state"
      tags: [cash]
      x-wave: 2
      x-permission: delivery.cash.read
      security: [{staffCookie: []}]
      parameters: [{name: driver_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/DriverCashSummary'}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /drivers/{driver_id}/liability-entries:
    get:
      operationId: listDriverLiability
      summary: "List a driver liability entries"
      tags: [cash]
      x-wave: 2
      x-permission: delivery.cash.read
      security: [{staffCookie: []}]
      parameters: [{name: driver_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/Cursor'}, {$ref: './components.yaml#/components/parameters/Limit'}, {$ref: './components.yaml#/components/parameters/Sort'}]
      responses:
        '200': {description: A page, content: {application/json: {schema: {allOf: [{$ref: './components.yaml#/components/schemas/Page'}, {type: object, properties: {data: {type: array, items: {$ref: './components.yaml#/components/schemas/DriverLiabilityEntry'}}}}]}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
    post:
      operationId: recordDriverLiability
      summary: "Record a clearance or correction entry"
      description: 'Append-only (D-20); a correction is a new signed entry, never an edit. A negative entry (surplus, clearance, write-off) is approved by the caller, recorded as approved_by, who must not be the cashier of the related handover (403 separation_of_duties). Audited with before and after balance.'
      tags: [cash]
      x-wave: 2
      x-permission: delivery.liability.record
      security: [{staffCookie: []}]
      parameters: [{name: driver_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}, {$ref: './components.yaml#/components/parameters/ElClient'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LiabilityEntryRequest'}}}}
      responses:
        '201': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/DriverLiabilityEntry'}}}}
        '400': {$ref: './components.yaml#/components/responses/BadRequest', description: 'Codes: validation_failed.'}
        '403': {$ref: './components.yaml#/components/responses/Forbidden', description: 'Codes: separation_of_duties.'}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /drivers/{driver_id}/trail:
    get:
      operationId: getDriverTrail
      summary: "Daily simplified trail for one business day"
      description: 'Trails are kept 90 days (document 2 §7).'
      tags: [locations]
      x-wave: 1
      x-permission: delivery.locations.read
      security: [{staffCookie: []}]
      parameters: [{name: driver_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/BusinessDate'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DriverTrail'}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /driver-locations/latest:
    get:
      operationId: listLatestDriverPositions
      summary: "Latest position per on-shift driver (polling twin of the stream)"
      tags: [locations]
      x-wave: 1
      x-permission: delivery.locations.read
      security: [{staffCookie: []}]
      parameters: [{$ref: './components.yaml#/components/parameters/SiteIdQuery'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DriverPositionList'}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /vehicles:
    get:
      operationId: listVehicles
      summary: "List vehicles"
      tags: [vehicles]
      x-wave: 1
      x-permission: delivery.drivers.read
      security: [{staffCookie: []}]
      parameters: [{name: active, in: query, schema: {type: boolean}}, {$ref: './components.yaml#/components/parameters/Cursor'}, {$ref: './components.yaml#/components/parameters/Limit'}, {$ref: './components.yaml#/components/parameters/Sort'}]
      responses:
        '200': {description: A page, content: {application/json: {schema: {allOf: [{$ref: './components.yaml#/components/schemas/Page'}, {type: object, properties: {data: {type: array, items: {$ref: './components.yaml#/components/schemas/Vehicle'}}}}]}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
    post:
      operationId: createVehicle
      summary: "Create a vehicle"
      tags: [vehicles]
      x-wave: 1
      x-permission: delivery.vehicles.manage
      security: [{staffCookie: []}]
      parameters: [{$ref: './components.yaml#/components/parameters/IdempotencyKey'}, {$ref: './components.yaml#/components/parameters/ElClient'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Vehicle'}}}}
      responses:
        '201': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Vehicle'}}}}
        '400': {$ref: './components.yaml#/components/responses/BadRequest', description: 'Codes: validation_failed.'}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /vehicles/{vehicle_id}:
    patch:
      operationId: updateVehicle
      summary: "Change a vehicle"
      tags: [vehicles]
      x-wave: 1
      x-permission: delivery.vehicles.manage
      security: [{staffCookie: []}]
      parameters: [{name: vehicle_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}, {$ref: './components.yaml#/components/parameters/ElClient'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Vehicle'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Vehicle'}}}}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /shifts:
    get:
      operationId: listShifts
      summary: "List shifts"
      tags: [shifts]
      x-wave: 1
      x-permission: delivery.drivers.read
      security: [{staffCookie: []}]
      parameters: [{$ref: './components.yaml#/components/parameters/StatusQuery'}, {$ref: './components.yaml#/components/parameters/SiteIdQuery'}, {$ref: './components.yaml#/components/parameters/DriverIdQuery'}, {$ref: './components.yaml#/components/parameters/BusinessDate'}, {$ref: './components.yaml#/components/parameters/Cursor'}, {$ref: './components.yaml#/components/parameters/Limit'}, {$ref: './components.yaml#/components/parameters/Sort'}]
      responses:
        '200': {description: A page, content: {application/json: {schema: {allOf: [{$ref: './components.yaml#/components/schemas/Page'}, {type: object, properties: {data: {type: array, items: {$ref: './components.yaml#/components/schemas/DriverShift'}}}}]}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
    post:
      operationId: planShift
      summary: "Plan a shift for a driver"
      tags: [shifts]
      x-wave: 2
      x-permission: delivery.shifts.manage
      security: [{staffCookie: []}]
      parameters: [{$ref: './components.yaml#/components/parameters/IdempotencyKey'}, {$ref: './components.yaml#/components/parameters/ElClient'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PlanShiftRequest'}}}}
      responses:
        '201': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/DriverShift'}}}}
        '400': {$ref: './components.yaml#/components/responses/BadRequest', description: 'Codes: validation_failed.'}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: site_kind_mismatch, idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /shifts/{shift_id}:
    get:
      operationId: getShift
      summary: "Get a shift"
      tags: [shifts]
      x-wave: 1
      x-permission: delivery.drivers.read
      security: [{staffCookie: []}]
      parameters: [{name: shift_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/DriverShift'}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /shifts/{shift_id}/cancel:
    post:
      operationId: cancelShift
      summary: "Cancel a planned shift"
      description: 'planned → cancelled (§3.17).'
      tags: [shifts]
      x-wave: 2
      x-permission: delivery.shifts.manage
      security: [{staffCookie: []}]
      parameters: [{name: shift_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}, {$ref: './components.yaml#/components/parameters/ElClient'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NoteRequest'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/DriverShift'}}}}
        '409': {$ref: './components.yaml#/components/responses/Conflict', description: 'Codes: invalid_transition.'}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /shifts/{shift_id}/end:
    post:
      operationId: endShift
      summary: "End a driver shift"
      description: 'active or paused → ended by dispatcher (§3.17); position reporting stops.'
      tags: [shifts]
      x-wave: 1
      x-permission: delivery.shifts.manage
      security: [{staffCookie: []}]
      parameters: [{name: shift_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}, {$ref: './components.yaml#/components/parameters/ElClient'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NoteRequest'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/DriverShift'}}}}
