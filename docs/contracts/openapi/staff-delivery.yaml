components:
  securitySchemes:
    staffCookie: {$ref: './components.yaml#/components/securitySchemes/staffCookie'}
  schemas:
    SiteCoverageRequest:
      type: object
      required: [zone_ids]
      properties: {zone_ids: {type: array, items: {type: string, format: uuid}}}
    SiteCoverage:
      type: object
      properties: {site_id: {type: string, format: uuid}, zone_ids: {type: array, items: {type: string, format: uuid}}}
    CoverageCheckRequest:
      type: object
      properties:
        address: {$ref: './components.yaml#/components/schemas/Address'}
        point: {$ref: './components.yaml#/components/schemas/Point'}
        site_id: {type: string, format: uuid}
    CreateDriverRequest:
      type: object
      required: [name, phone, home_site_id]
      properties:
        name: {type: string}
        phone: {type: string, description: Normalised to E.164 (document 4 §3.2)}
        home_site_id: {type: string, format: uuid}
        capacity_limit: {type: integer, minimum: 1, default: 30}
        locale: {type: string, enum: [ar, en]}
    UpdateDriverRequest:
      type: object
      properties:
        name: {type: string}
        home_site_id: {type: string, format: uuid}
        status: {type: string, enum: [active, suspended, archived]}
        capacity_limit: {type: integer, minimum: 0}
    NoteRequest:
      type: object
      properties: {note: {type: string, maxLength: 1000}}
    ReasonRequest:
      type: object
      required: [reason_code]
      properties: {reason_code: {type: string, x-extensible-enum: true}, note: {type: string, maxLength: 1000}}
    LiabilityEntryRequest:
      type: object
      required: [amount, reason]
      properties:
        amount: {$ref: './components.yaml#/components/schemas/SignedMoney'}
        reason: {type: string, enum: [handover_deficit, handover_surplus, clearance, write_off, correction]}
        handover_id: {type: string, format: uuid}
        reference: {type: string, maxLength: 200, description: Required when no handover_id}
        note: {type: string, maxLength: 1000}
      anyOf: [{required: [handover_id]}, {required: [reference]}]
    DriverTrail:
      type: object
      properties:
        driver_id: {type: string, format: uuid}
        business_date: {type: string, format: date}
        line: {type: object, description: 'GeoJSON LineString, simplified'}
    DriverPositionList:
      type: object
      properties: {data: {type: array, items: {$ref: './components.yaml#/components/schemas/DriverPosition'}}}
    PlanShiftRequest:
      type: object
      required: [driver_id, site_id, planned_start, planned_end]
      properties:
        driver_id: {type: string, format: uuid}
        site_id: {type: string, format: uuid}
        vehicle_id: {type: string, format: uuid}
        planned_start: {type: string, format: date-time}
        planned_end: {type: string, format: date-time}
    UpdateOrderRequest:
      type: object
      properties:
        recipient: {$ref: './components.yaml#/components/schemas/Recipient'}
        address: {$ref: './components.yaml#/components/schemas/Address'}
        items: {type: array, items: {$ref: './components.yaml#/components/schemas/OrderItem'}}
        cod_amount: {$ref: './components.yaml#/components/schemas/Money'}
        notes: {type: string}
    TransitionRequest:
      type: object
      required: [to_status]
      properties:
        to_status: {type: string, enum: [accepted, failed]}
        reason_code: {type: string}
        note: {type: string, maxLength: 1000}
    RescheduleRequest:
      type: object
      required: [slot_id]
      properties: {slot_id: {type: string, format: uuid}, note: {type: string}}
    AddressPinRequest:
      type: object
      required: [point]
      properties: {point: {$ref: './components.yaml#/components/schemas/Point'}, note: {type: string}}
    CreateOrderImportRequest:
      type: object
      required: [file_name, site_id, sha256, size_bytes]
      properties: {file_name: {type: string, pattern: '\.csv$'}, site_id: {type: string, format: uuid}, sha256: {type: string, pattern: '^[a-f0-9]{64}$'}, size_bytes: {type: integer, minimum: 1, maximum: 20971520}}
    OrderImportCreated:
      type: object
      properties:
        job: {$ref: './components.yaml#/components/schemas/Job'}
        upload: {$ref: './components.yaml#/components/schemas/UploadTicket'}
    ImportRowError:
      type: object
      properties: {row: {type: integer}, column: {type: string}, code: {type: string}, message: {type: string}}
    OfferRequest:
      type: object
      required: [driver_ids]
      properties:
        driver_ids: {type: array, minItems: 1, maxItems: 20, items: {type: string, format: uuid}}
        expires_in_s: {type: integer, minimum: 30, maximum: 1800, default: 120}
    OfferList:
      type: object
      properties: {data: {type: array, items: {$ref: './components.yaml#/components/schemas/Offer'}}}
    AssignRequest:
      type: object
      required: [driver_id]
      properties: {driver_id: {type: string, format: uuid}, vehicle_id: {type: string, format: uuid}, note: {type: string}}
    ConfirmHandoverRequest:
      type: object
      required: [counted_amount]
      properties: {counted_amount: {$ref: './components.yaml#/components/schemas/Money'}, note: {type: string}}
    UploadRequest:
      type: object
      required: [content_type, sha256]
      properties: {content_type: {type: string, enum: [image/jpeg, image/png, application/pdf]}, sha256: {type: string, pattern: '^[a-f0-9]{64}$'}, size_bytes: {type: integer, minimum: 1, maximum: 10485760}}
    DepositRequest:
      type: object
      required: [site_id, amount, bank_reference, deposited_at, collection_ids]
      properties:
        site_id: {type: string, format: uuid}
        amount: {$ref: './components.yaml#/components/schemas/SignedMoney'}
        bank_reference: {type: string}
        deposited_at: {type: string, format: date-time}
        slip_upload_id: {type: string, format: uuid, description: From createDepositSlipUpload}
        collection_ids: {type: array, items: {type: string, format: uuid}}
        reverses_deposit_id: {type: string, format: uuid}
      allOf:
        - if: {required: [amount], properties: {amount: {required: [amount], properties: {amount: {exclusiveMaximum: 0}}}}}
          then: {required: [reverses_deposit_id], properties: {reverses_deposit_id: {type: string}}}
    IssueTrackingTokenRequest:
      type: object
      required: [purpose]
      properties:
        purpose: {type: string, enum: [track, reschedule, address_pin]}
        send_via_whatsapp: {type: boolean, default: false}
