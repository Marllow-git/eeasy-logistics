components:
  securitySchemes:
    platformCookie: {$ref: './components.yaml#/components/securitySchemes/platformCookie'}
  schemas:

    PlatformRole:
      type: string
      enum: [platform_super_admin, platform_admin, platform_support]
    PlatformUser:
      type: object
      allOf: [{$ref: './components.yaml#/components/schemas/User'}]
      properties:
        roles: {type: array, items: {$ref: '#/components/schemas/PlatformRole'}}
        totp_enrolled: {type: boolean}
    PlatformMe:
      type: object
      properties:
        user: {$ref: '#/components/schemas/PlatformUser'}
        permissions: {type: array, items: {type: string}}
    PlatformLoginRequest:
      type: object
      required: [email, password]
      properties: {email: {type: string, format: email}, password: {type: string, maxLength: 256}}
    PlatformAcceptInvitationRequest:
      type: object
      required: [token, name, password]
      properties: {token: {type: string}, name: {type: string}, password: {type: string, minLength: 12, maxLength: 256}}
    ChallengeOnlyRequest:
      type: object
      required: [challenge_id]
      properties: {challenge_id: {type: string}}
    TotpEnrolment:
      type: object
      properties: {challenge_id: {type: string}, otpauth_uri: {type: string, description: Shown once; never stored in the idempotency store or logs}}
    ResetReasonRequest:
      type: object
      required: [reason]
      properties: {reason: {type: string, minLength: 5, maxLength: 500}}
    TotpChallenge:
      type: object
      properties: {challenge_id: {type: string}, totp_enrolment_required: {type: boolean}}
    TotpVerifyRequest:
      type: object
      required: [challenge_id, code]
      properties: {challenge_id: {type: string}, code: {type: string, pattern: '^[0-9]{6}$'}}
    ProvisionAccountRequest:
      type: object
      required: [name, default_locale, limits, owner]
      properties:
        name: {type: string}
        default_locale: {type: string, enum: [ar, en]}
        limits: {$ref: './components.yaml#/components/schemas/AccountLimits'}
