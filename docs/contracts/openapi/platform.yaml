openapi: 3.1.0
info:
  title: "eeasy-logistics platform API"
  version: 1.0.0
  license: {name: Proprietary, identifier: LicenseRef-Proprietary}
  description: >-
    The platform admin surface (document 4 §3.3, §5, §6; platform.md). Operations marked x-cross-tenant
    run in a @CrossTenant() handler: the account id comes from the path, every call writes an audit row,
    and reads of operational data require the X-Support-Reason header. Conventions, errors and waves:
    docs/contracts/README.md.
servers:
  - url: /v1/platform
security:
  - platformCookie: []
tags:
  - {name: auth, description: "Platform sign-in with mandatory TOTP (document 4 §3.3)"}
  - {name: accounts, description: "Accounts (§2.1, K-1, K-2)"}
  - {name: provisioning, description: "Sites, zones and coverage at provisioning (ADR-0015)"}
  - {name: rollout, description: "Rollout modes and flags (§2.4, ADR-0006)"}
  - {name: support, description: "Cross-tenant reads, audited (document 4 §5)"}
  - {name: outbox, description: "Outbox, consumers, dead letters (ADR-0024)"}
  - {name: inbound, description: "Inbound channel and carrier webhooks (document 9)"}
  - {name: diagnose, description: "Diagnose console"}
  - {name: staff, description: "Platform staff"}
  - {name: audit, description: "Platform audit log"}
paths:
  /auth/login:
    post:
      operationId: platformLogin
      summary: "Platform sign-in, step one: email and password"
      description: 'TOTP is mandatory; no cookie is set until it is verified.'
      tags: [auth]
      x-wave: 0
      x-permission: core.auth.anonymous
      security: []
      parameters: [{$ref: './components.yaml#/components/parameters/ElClient'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PlatformLoginRequest'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/TotpChallenge'}}}}
        '401': {$ref: './components.yaml#/components/responses/Unauthorized', description: 'Codes: invalid_credentials.'}
        '429': {$ref: './components.yaml#/components/responses/TooManyRequests', description: 'Codes: rate_limited.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /auth/totp/verify:
    post:
      operationId: platformVerifyTotp
      summary: "Platform sign-in, step two: TOTP"
      description: 'TOTP with a one-step clock tolerance; a code already used in its window is refused. At most 5 verification attempts per code or challenge, then it is invalidated; challenges expire after 5 minutes.'
      tags: [auth]
      x-wave: 0
      x-permission: core.auth.anonymous
      security: []
      parameters: [{$ref: './components.yaml#/components/parameters/ElClient'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TotpVerifyRequest'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/PlatformMe'}}}}
        '401': {$ref: './components.yaml#/components/responses/Unauthorized', description: 'Codes: otp_invalid, token_expired.'}
        '429': {$ref: './components.yaml#/components/responses/TooManyRequests', description: 'Codes: rate_limited.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /auth/invitations/accept:
    post:
      operationId: platformAcceptInvitation
      summary: "Accept a platform staff invitation and set the password"
      description: 'One-time invitation token valid 72 h. Returns a challenge with totp_enrolment_required; no session exists until TOTP is enrolled and verified.'
      tags: [auth]
      x-wave: 0
      x-permission: core.auth.anonymous
      security: []
      parameters: [{$ref: './components.yaml#/components/parameters/ElClient'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PlatformAcceptInvitationRequest'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/TotpChallenge'}}}}
        '401': {$ref: './components.yaml#/components/responses/Unauthorized', description: 'Codes: token_invalid, token_expired.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /auth/totp/enrol:
    post:
      operationId: platformEnrolTotp
      summary: "Start TOTP enrolment for a password-authenticated challenge"
      description: 'Allowed only with a challenge from the password step or invitation accept, younger than 5 minutes, for a user with no TOTP enrolled (409 second_factor_already_enrolled; re-enrolment needs a super admin reset). Returns the otpauth URI once.'
      tags: [auth]
      x-wave: 0
      x-permission: core.auth.anonymous
      security: []
      parameters: [{$ref: './components.yaml#/components/parameters/ElClient'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChallengeOnlyRequest'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/TotpEnrolment'}}}}
        '401': {$ref: './components.yaml#/components/responses/Unauthorized', description: 'Codes: token_invalid, token_expired, reauthentication_required.'}
        '409': {$ref: './components.yaml#/components/responses/Conflict', description: 'Codes: second_factor_already_enrolled.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /auth/totp/confirm:
    post:
      operationId: platformConfirmTotp
      summary: "Confirm TOTP enrolment with a first code and start the session"
      description: 'At most 5 attempts per challenge, 5-minute expiry; the confirming code cannot be reused. Audited.'
      tags: [auth]
      x-wave: 0
      x-permission: core.auth.anonymous
      security: []
      parameters: [{$ref: './components.yaml#/components/parameters/ElClient'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TotpVerifyRequest'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/PlatformMe'}}}}
        '401': {$ref: './components.yaml#/components/responses/Unauthorized', description: 'Codes: otp_invalid, token_expired.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /auth/refresh:
    post:
      operationId: platformRefresh
      summary: "Rotate the platform session"
      description: 'Sessions expire after 12 h idle (document 4 §3.3).'
      tags: [auth]
      x-wave: 0
      x-permission: platform.auth.self
      security: []
      parameters: [{$ref: './components.yaml#/components/parameters/ElClient'}]
      responses:
        '204': {description: Done}
        '401': {$ref: './components.yaml#/components/responses/Unauthorized', description: 'Codes: token_invalid, token_expired.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /auth/logout:
    post:
      operationId: platformLogout
      summary: "End the platform session"
      tags: [auth]
      x-wave: 0
      x-permission: platform.auth.self
      security: [{platformCookie: []}]
      parameters: [{$ref: './components.yaml#/components/parameters/ElClient'}]
      responses:
        '204': {description: Done}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /me:
    get:
      operationId: platformGetMe
      summary: "Current platform user and roles"
      tags: [auth]
      x-wave: 0
      x-permission: platform.auth.self
      security: [{platformCookie: []}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/PlatformMe'}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /accounts:
    get:
      operationId: platformListAccounts
      summary: "List accounts"
      tags: [accounts]
      x-wave: 0
      x-permission: platform.accounts.read
      security: [{platformCookie: []}]
      parameters: [{$ref: './components.yaml#/components/parameters/StatusQuery'}, {$ref: './components.yaml#/components/parameters/Q'}, {$ref: './components.yaml#/components/parameters/Cursor'}, {$ref: './components.yaml#/components/parameters/Limit'}, {$ref: './components.yaml#/components/parameters/Sort'}]
      responses:
        '200': {description: A page, content: {application/json: {schema: {allOf: [{$ref: './components.yaml#/components/schemas/Page'}, {type: object, properties: {data: {type: array, items: {$ref: './components.yaml#/components/schemas/Account'}}}}]}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
    post:
      operationId: platformProvisionAccount
      summary: "Provision an account"
      description: 'K-1: the only way an account comes to exist. Writes limits and module flags with provisioned_by, invites the owner, emits core.account.provisioned. Audited.'
      tags: [accounts]
      x-wave: 0
      x-permission: platform.accounts.provision
      security: [{platformCookie: []}]
      parameters: [{$ref: './components.yaml#/components/parameters/IdempotencyKey'}, {$ref: './components.yaml#/components/parameters/ElClient'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProvisionAccountRequest'}}}}
      responses:
        '201': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Account'}}}}
        '400': {$ref: './components.yaml#/components/responses/BadRequest', description: 'Codes: validation_failed.'}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /accounts/{account_id}:
    get:
      operationId: platformGetAccount
      summary: "Get an account with limits and usage"
      tags: [accounts]
      x-wave: 0
      x-permission: platform.accounts.read
      x-cross-tenant: true
      security: [{platformCookie: []}]
      parameters: [{name: account_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Account'}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
    patch:
      operationId: platformUpdateAccount
      summary: "Change name, locale or limits"
      tags: [accounts]
      x-wave: 0
      x-permission: platform.accounts.provision
      x-cross-tenant: true
      security: [{platformCookie: []}]
      parameters: [{name: account_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}, {$ref: './components.yaml#/components/parameters/ElClient'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateAccountRequest'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Account'}}}}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /accounts/{account_id}/owner-invitations:
    post:
      operationId: platformInviteOwner
      summary: "Invite or re-invite the account owner"
      tags: [accounts]
      x-wave: 0
      x-permission: platform.accounts.provision
      x-cross-tenant: true
      security: [{platformCookie: []}]
      parameters: [{name: account_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}, {$ref: './components.yaml#/components/parameters/ElClient'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OwnerInviteRequest'}}}}
      responses:
        '201': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Membership'}}}}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /accounts/{account_id}/suspend:
    post:
      operationId: platformSuspendAccount
      summary: "Suspend an account"
      description: 'active → suspended. Pauses outbox effects, rejects API keys, ends driver shifts, blocks refresh; data kept (K-2, document 4 §6).'
      tags: [accounts]
      x-wave: 0
      x-permission: platform.accounts.suspend
      x-cross-tenant: true
      security: [{platformCookie: []}]
      parameters: [{name: account_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}, {$ref: './components.yaml#/components/parameters/ElClient'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PlatformReasonRequest'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Account'}}}}
        '409': {$ref: './components.yaml#/components/responses/Conflict', description: 'Codes: invalid_transition.'}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /accounts/{account_id}/reactivate:
    post:
      operationId: platformReactivateAccount
      summary: "Reactivate a suspended account"
      description: 'suspended → active (§2.1).'
      tags: [accounts]
      x-wave: 0
      x-permission: platform.accounts.suspend
      x-cross-tenant: true
      security: [{platformCookie: []}]
      parameters: [{name: account_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}, {$ref: './components.yaml#/components/parameters/ElClient'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PlatformReasonRequest'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Account'}}}}
        '409': {$ref: './components.yaml#/components/responses/Conflict', description: 'Codes: invalid_transition.'}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /accounts/{account_id}/close:
    post:
      operationId: platformCloseAccount
      summary: "Close an account"
      description: 'suspended → closed (§2.1). Retention follows document 5.'
      tags: [accounts]
      x-wave: 0
      x-permission: platform.accounts.suspend
      x-cross-tenant: true
      security: [{platformCookie: []}]
      parameters: [{name: account_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}, {$ref: './components.yaml#/components/parameters/ElClient'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PlatformReasonRequest'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Account'}}}}
        '409': {$ref: './components.yaml#/components/responses/Conflict', description: 'Codes: invalid_transition.'}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /accounts/{account_id}/sites:
    post:
      operationId: platformProvisionSite
      summary: "Create a site during provisioning"
      tags: [provisioning]
      x-wave: 0
      x-permission: platform.accounts.provision
      x-cross-tenant: true
      security: [{platformCookie: []}]
      parameters: [{name: account_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}, {$ref: './components.yaml#/components/parameters/ElClient'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Site'}}}}
      responses:
        '201': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Site'}}}}
        '400': {$ref: './components.yaml#/components/responses/BadRequest', description: 'Codes: validation_failed.'}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: limit_exceeded, idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /accounts/{account_id}/zones:
    post:
      operationId: platformProvisionZone
      summary: "Create a zone from an official boundary"
      tags: [provisioning]
      x-wave: 0
      x-permission: platform.accounts.provision
      x-cross-tenant: true
      security: [{platformCookie: []}]
      parameters: [{name: account_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}, {$ref: './components.yaml#/components/parameters/ElClient'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Zone'}}}}
      responses:
        '201': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Zone'}}}}
        '400': {$ref: './components.yaml#/components/responses/BadRequest', description: 'Codes: validation_failed.'}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /accounts/{account_id}/coverage:
    put:
      operationId: platformProvisionCoverage
      summary: "Set own-fleet coverage (site, zone) for the account"
      description: 'ADR-0015: coverage is explicit data created by the provisioning door before first use. K-4: branch or both sites only. Every site_id and zone_id must belong to the path account (404 not_found otherwise).'
      tags: [provisioning]
      x-wave: 0
      x-permission: platform.accounts.provision
      x-cross-tenant: true
      security: [{platformCookie: []}]
      parameters: [{name: account_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}, {$ref: './components.yaml#/components/parameters/ElClient'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CoverageProvisionRequest'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/CoverageList'}}}}
        '404': {$ref: './components.yaml#/components/responses/NotFound', description: 'Codes: not_found.'}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: site_kind_mismatch, idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /rollout-modes:
    get:
      operationId: platformListRolloutModes
      summary: "Rollout mode per feature key"
      tags: [rollout]
      x-wave: 0
      x-permission: platform.accounts.read
      security: [{platformCookie: []}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RolloutModeList'}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /rollout-modes/{feature_key}:
    put:
      operationId: platformSetRolloutMode
      summary: "Set off, allowlist or all for a feature"
      description: 'Super admin only (§2.4); emits core.feature_flag.changed; audited.'
      tags: [rollout]
      x-wave: 0
      x-permission: platform.rollout.manage
      security: [{platformCookie: []}]
      parameters: [{name: feature_key, in: path, required: true, schema: {type: string}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}, {$ref: './components.yaml#/components/parameters/ElClient'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RolloutModeRequest'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/RolloutMode'}}}}
        '403': {$ref: './components.yaml#/components/responses/Forbidden', description: 'Codes: rollout_change_forbidden.'}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /accounts/{account_id}/feature-flags:
    get:
      operationId: platformListFeatureFlags
      summary: "Feature flags of an account"
      tags: [rollout]
      x-wave: 0
      x-permission: platform.accounts.read
      x-cross-tenant: true
      security: [{platformCookie: []}]
      parameters: [{name: account_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/FeatureFlagList'}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /accounts/{account_id}/feature-flags/{feature_key}:
    put:
      operationId: platformSetFeatureFlag
      summary: "Enable or disable a feature for an account"
      description: 'Sets provisioned_by to the caller (K-6); emits core.feature_flag.changed; audited.'
      tags: [rollout]
      x-wave: 0
      x-permission: platform.flags.manage
      x-cross-tenant: true
      security: [{platformCookie: []}]
      parameters: [{name: account_id, in: path, required: true, schema: {type: string, format: uuid}}, {name: feature_key, in: path, required: true, schema: {type: string}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}, {$ref: './components.yaml#/components/parameters/ElClient'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FeatureFlagRequest'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/FeatureFlag'}}}}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /accounts/{account_id}/members:
    get:
      operationId: platformListAccountMembers
      summary: "Members of an account"
      description: '@CrossTenant: one audit row per call with the X-Support-Reason text.'
      tags: [support]
      x-wave: 0
      x-permission: platform.tenants.read
      x-cross-tenant: true
      security: [{platformCookie: []}]
      parameters: [{name: account_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/SupportReason'}, {$ref: './components.yaml#/components/parameters/Cursor'}, {$ref: './components.yaml#/components/parameters/Limit'}, {$ref: './components.yaml#/components/parameters/Sort'}]
      responses:
        '200': {description: A page, content: {application/json: {schema: {allOf: [{$ref: './components.yaml#/components/schemas/Page'}, {type: object, properties: {data: {type: array, items: {$ref: './components.yaml#/components/schemas/Membership'}}}}]}}}}
        '400': {$ref: './components.yaml#/components/responses/BadRequest', description: 'Codes: reason_required.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /accounts/{account_id}/orders:
    get:
      operationId: platformListAccountOrders
      summary: "Orders of an account"
      description: '@CrossTenant, audited per call.'
      tags: [support]
      x-wave: 1
      x-permission: platform.tenants.read
      x-cross-tenant: true
      security: [{platformCookie: []}]
      parameters: [{name: account_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/SupportReason'}, {$ref: './components.yaml#/components/parameters/StatusQuery'}, {$ref: './components.yaml#/components/parameters/CreatedFrom'}, {$ref: './components.yaml#/components/parameters/CreatedTo'}, {name: number, in: query, schema: {type: string}}, {$ref: './components.yaml#/components/parameters/Cursor'}, {$ref: './components.yaml#/components/parameters/Limit'}, {$ref: './components.yaml#/components/parameters/Sort'}]
      responses:
        '200': {description: A page, content: {application/json: {schema: {allOf: [{$ref: './components.yaml#/components/schemas/Page'}, {type: object, properties: {data: {type: array, items: {$ref: './components.yaml#/components/schemas/Order'}}}}]}}}}
        '400': {$ref: './components.yaml#/components/responses/BadRequest', description: 'Codes: reason_required.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /accounts/{account_id}/orders/{order_id}:
    get:
      operationId: platformGetAccountOrder
      summary: "One order of an account"
      description: '@CrossTenant, audited per call.'
      tags: [support]
      x-wave: 1
      x-permission: platform.tenants.read
      x-cross-tenant: true
      security: [{platformCookie: []}]
      parameters: [{name: account_id, in: path, required: true, schema: {type: string, format: uuid}}, {name: order_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/SupportReason'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Order'}}}}
        '400': {$ref: './components.yaml#/components/responses/BadRequest', description: 'Codes: reason_required.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /accounts/{account_id}/orders/{order_id}/events:
    get:
      operationId: platformListAccountOrderEvents
      summary: "Event history of an order"
