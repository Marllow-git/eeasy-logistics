      parameters: [{$ref: './components.yaml#/components/parameters/StatusQuery'}, {name: product_id, in: query, schema: {type: string, format: uuid}}, {name: connection_id, in: query, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/Cursor'}, {$ref: './components.yaml#/components/parameters/Limit'}, {$ref: './components.yaml#/components/parameters/Sort'}]
