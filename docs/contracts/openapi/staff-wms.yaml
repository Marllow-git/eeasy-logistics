        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
components:
  securitySchemes:
    staffCookie: {$ref: './components.yaml#/components/securitySchemes/staffCookie'}
  schemas:

    WmsReasonRequest:
      type: object
      required: [reason_code]
      properties: {reason_code: {type: string, x-extensible-enum: true}, note: {type: string, maxLength: 1000}}
    UpdateLocationRequest:
      type: object
      properties: {code: {type: string}, pickable: {type: boolean}, active: {type: boolean}, coordinates: {type: object}}
    MoveToteRequest:
      type: object
      required: [to_parent_id]
      properties: {to_parent_id: {type: string, format: uuid}}
    StockRef:
      type: object
      description: 'A product quantity; lot_id or lot_code iff tracking_mode lot, serial iff serial with quantity 1 (W-4).'
      required: [product_id, quantity]
      properties:
        product_id: {type: string, format: uuid}
        quantity: {type: integer, minimum: 1}
        lot_id: {type: string, format: uuid}
        lot_code: {type: string}
        expiry_date: {type: string, format: date}
        serial_id: {type: string, format: uuid}
        serial_number: {type: string}
    CreateReceiptRequest:
      type: object
      required: [site_id, receiving_location_id]
      properties:
        site_id: {type: string, format: uuid}
        purchase_order_id: {type: string, format: uuid}
        receiving_location_id: {type: string, format: uuid}
        lines: {type: array, items: {$ref: '#/components/schemas/StockRef'}}
    ReceiveLineRequest:
      allOf:
        - $ref: '#/components/schemas/StockRef'
        - type: object
          properties: {line_id: {type: string, format: uuid}, damaged: {type: integer, minimum: 0}}
    PutAwayRequest:
      type: object
      required: [moves]
      properties:
        moves:
          type: array
          minItems: 1
          items:
            allOf:
              - $ref: '#/components/schemas/StockRef'
              - type: object
                required: [to_location_id]
                properties: {to_location_id: {type: string, format: uuid}}
    CreateFulfilmentOrderRequest:
      type: object
      required: [site_id, recipient, address, lines]
      properties:
        site_id: {type: string, format: uuid}
        source_ref: {type: string}
        recipient: {$ref: './components.yaml#/components/schemas/Recipient'}
        address: {$ref: './components.yaml#/components/schemas/Address'}
        cod_amount: {$ref: './components.yaml#/components/schemas/Money'}
        lines: {type: array, minItems: 1, items: {type: object, required: [product_id, quantity], properties: {product_id: {type: string, format: uuid}, quantity: {type: integer, minimum: 1}}}}
    CreatePickTaskRequest:
      type: object
      required: [fulfilment_order_ids]
      properties:
        fulfilment_order_ids: {type: array, minItems: 1, items: {type: string, format: uuid}}
        picker_id: {type: string, format: uuid}
        target_tote_id: {type: string, format: uuid}
    PickRequest:
      allOf:
        - $ref: '#/components/schemas/StockRef'
        - type: object
          required: [line_id, from_location_id]
          properties: {line_id: {type: string, format: uuid}, from_location_id: {type: string, format: uuid}}
    ShortPickRequest:
      type: object
      required: [line_id]
      properties: {line_id: {type: string, format: uuid}, picked: {type: integer, minimum: 0}, note: {type: string}}
    OpenPackageRequest:
      type: object
      required: [fulfilment_order_id]
      properties: {fulfilment_order_id: {type: string, format: uuid}}
    PackRequest:
      type: object
      required: [contents, weight_g, length_mm, width_mm, height_mm]
      properties:
        contents: {type: array, minItems: 1, items: {allOf: [{$ref: '#/components/schemas/StockRef'}, {type: object, properties: {fulfilment_order_line_id: {type: string, format: uuid}, from_tote_id: {type: string, format: uuid}}}]}}
        consumables: {type: array, items: {type: object, properties: {product_id: {type: string, format: uuid}, quantity: {type: integer, minimum: 1}}}}
        weight_g: {type: integer, minimum: 1}
        length_mm: {type: integer, minimum: 1}
        width_mm: {type: integer, minimum: 1}
        height_mm: {type: integer, minimum: 1}
    FulfilmentOptions:
      type: object
      properties:
        own_fleet: {type: object, properties: {available: {type: boolean}, reason: {type: [string, 'null'], enum: [outside_coverage, feature_not_enabled, null]}, site_id: {type: string, format: uuid}}}
        carriers: {type: array, items: {type: object, properties: {carrier_code: {type: string}, name_ar: {type: string}, name_en: {type: string}}}, description: From Eeasy shipping; this product never prices (ADR-0014)}
    ChooseMethodRequest:
      type: object
      required: [method]
      properties:
        method: {type: string, enum: [own_fleet, carrier]}
        carrier_code: {type: string, description: Required for carrier}
        slot_id: {type: string, format: uuid, description: Optional own-fleet slot}
    CreateReturnRequest:
      type: object
      required: [site_id, source]
      properties:
        site_id: {type: string, format: uuid}
        source: {type: string, enum: [carrier_return, walk_in]}
        source_ref: {type: string}
        lines: {type: array, items: {$ref: '#/components/schemas/StockRef'}}
    ReceiveReturnRequest:
      type: object
      required: [lines]
      properties:
        lines: {type: array, items: {allOf: [{$ref: '#/components/schemas/StockRef'}, {type: object, properties: {condition: {type: string}}}]}}
    DispositionRequest:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          items: {type: object, required: [line_id, disposition], properties: {line_id: {type: string, format: uuid}, disposition: {type: string, enum: [restock, quarantine, scrap]}, to_location_id: {type: string, format: uuid}}}
    CreateAdjustmentRequest:
      type: object
      required: [site_id, reason_code, lines]
      properties:
        site_id: {type: string, format: uuid}
        reason_code: {type: string}
        note: {type: string}
        lines:
          type: array
          minItems: 1
          items: {type: object, required: [location_id, product_id, delta], properties: {location_id: {type: string, format: uuid}, product_id: {type: string, format: uuid}, lot_id: {type: string, format: uuid}, serial_id: {type: string, format: uuid}, delta: {type: integer, not: {const: 0}}}}
    PlanCountRequest:
      type: object
      required: [site_id]
      properties:
        site_id: {type: string, format: uuid}
        location_ids: {type: array, items: {type: string, format: uuid}}
        product_ids: {type: array, items: {type: string, format: uuid}}
        blind: {type: boolean, default: true}
    RecordCountsRequest:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 1
          items: {type: object, required: [location_id, product_id, counted], properties: {location_id: {type: string, format: uuid}, product_id: {type: string, format: uuid}, lot_id: {type: string, format: uuid}, serial_id: {type: string, format: uuid}, counted: {type: integer, minimum: 0}}}
