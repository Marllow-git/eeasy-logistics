openapi: 3.1.0
info:
  title: "eeasy-logistics staff API: WMS"
  version: 1.0.0
  license: {name: Proprietary, identifier: LicenseRef-Proprietary}
  description: >-
    The web app surface for warehouse staff, WMS part (waves 3 and 4), at operation level with the
    aggregate schemas of document 2 §4. Same base path and session as staff.yaml (ADR-0026 split by
    context). Stock movements are read only: the ledger service writes them as a side effect of the
    operations below (ADR-0011, W-5). Conventions, errors and waves: docs/contracts/README.md.
servers:
  - url: /v1/staff
security:
  - staffCookie: []
tags:
  - {name: locations, description: "Location tree and totes (§4.1, ADR-0012)"}
  - {name: products, description: "Products, lots, serials (§4.2)"}
  - {name: purchasing, description: "Suppliers and purchase orders (§4.3)"}
  - {name: receiving, description: "Inbound receipts (§4.11)"}
  - {name: stock, description: "Ledger and projections, read only (§4.4, §4.5, ADR-0011)"}
  - {name: fulfilment, description: "Fulfilment orders (§4.12)"}
  - {name: picking, description: "Pick tasks (§4.13)"}
  - {name: packing, description: "Packages and pack-time handoff (§4.14, ADR-0014)"}
  - {name: returns, description: "Returns (§4.8, W-17)"}
  - {name: adjustments, description: "Adjustments (§4.8, W-16)"}
  - {name: counting, description: "Count sessions (§4.15)"}
  - {name: channels, description: "Channel publications (§4.9, ADR-0013)"}
paths:
  /locations:
    get:
      operationId: listLocations
      summary: "List locations"
      tags: [locations]
      x-wave: 3
      x-permission: wms.locations.read
      security: [{staffCookie: []}]
      parameters: [{$ref: './components.yaml#/components/parameters/SiteIdQuery'}, {name: type, in: query, schema: {type: string}}, {name: parent_id, in: query, schema: {type: string, format: uuid}}, {name: pickable, in: query, schema: {type: boolean}}, {$ref: './components.yaml#/components/parameters/Q'}, {$ref: './components.yaml#/components/parameters/Cursor'}, {$ref: './components.yaml#/components/parameters/Limit'}, {$ref: './components.yaml#/components/parameters/Sort'}]
      responses:
        '200': {description: A page, content: {application/json: {schema: {allOf: [{$ref: './components.yaml#/components/schemas/Page'}, {type: object, properties: {data: {type: array, items: {$ref: './components.yaml#/components/schemas/Location'}}}}]}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
    post:
      operationId: createLocation
      summary: "Create a location or tote"
      description: 'W-1: same site as the parent, no cycles; warehouse or both sites only (K-4).'
      tags: [locations]
      x-wave: 3
      x-permission: wms.locations.manage
      security: [{staffCookie: []}]
      parameters: [{$ref: './components.yaml#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Location'}}}}
      responses:
        '201': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Location'}}}}
        '400': {$ref: './components.yaml#/components/responses/BadRequest', description: 'Codes: validation_failed.'}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: location_tree_invalid, site_kind_mismatch, idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /locations/{location_id}:
    get:
      operationId: getLocation
      summary: "Get a location"
      tags: [locations]
      x-wave: 3
      x-permission: wms.locations.read
      security: [{staffCookie: []}]
      parameters: [{name: location_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Location'}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
    patch:
      operationId: updateLocation
      summary: "Change code, pickable or active"
      description: 'parent_id of a tote changes only through the move operation (W-2).'
      tags: [locations]
      x-wave: 3
      x-permission: wms.locations.manage
      security: [{staffCookie: []}]
      parameters: [{name: location_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateLocationRequest'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Location'}}}}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: location_tree_invalid, idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /totes/{tote_id}/move:
    post:
      operationId: moveTote
      summary: "Move a tote to a new parent location"
      description: 'Writes one transfer movement batch for the tote contents (W-2, ADR-0011).'
      tags: [locations]
      x-wave: 3
      x-permission: wms.locations.manage
      security: [{staffCookie: []}]
      parameters: [{name: tote_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MoveToteRequest'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Location'}}}}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: location_tree_invalid, idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /products:
    get:
      operationId: listProducts
      summary: "List products"
      tags: [products]
      x-wave: 3
      x-permission: wms.products.read
      security: [{staffCookie: []}]
      parameters: [{name: barcode, in: query, schema: {type: string}}, {name: sku, in: query, schema: {type: string}}, {name: active, in: query, schema: {type: boolean}}, {$ref: './components.yaml#/components/parameters/Q'}, {$ref: './components.yaml#/components/parameters/Cursor'}, {$ref: './components.yaml#/components/parameters/Limit'}, {$ref: './components.yaml#/components/parameters/Sort'}]
      responses:
        '200': {description: A page, content: {application/json: {schema: {allOf: [{$ref: './components.yaml#/components/schemas/Page'}, {type: object, properties: {data: {type: array, items: {$ref: './components.yaml#/components/schemas/Product'}}}}]}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
    post:
      operationId: createProduct
      summary: "Create a product"
      tags: [products]
      x-wave: 3
      x-permission: wms.products.manage
      security: [{staffCookie: []}]
      parameters: [{$ref: './components.yaml#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Product'}}}}
      responses:
        '201': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Product'}}}}
        '400': {$ref: './components.yaml#/components/responses/BadRequest', description: 'Codes: validation_failed.'}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /products/{product_id}:
    get:
      operationId: getProduct
      summary: "Get a product"
      tags: [products]
      x-wave: 3
      x-permission: wms.products.read
      security: [{staffCookie: []}]
      parameters: [{name: product_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Product'}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
    patch:
      operationId: updateProduct
      summary: "Change a product"
      description: 'tracking_mode cannot change once the product has a movement (W-3).'
      tags: [products]
      x-wave: 3
      x-permission: wms.products.manage
      security: [{staffCookie: []}]
      parameters: [{name: product_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Product'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Product'}}}}
        '409': {$ref: './components.yaml#/components/responses/Conflict', description: 'Codes: tracking_mode_locked.'}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /products/{product_id}/lots:
    get:
      operationId: listLots
      summary: "Lots of a product"
      tags: [products]
      x-wave: 3
      x-permission: wms.products.read
      security: [{staffCookie: []}]
      parameters: [{name: product_id, in: path, required: true, schema: {type: string, format: uuid}}, {name: expiring_before, in: query, schema: {type: string, format: date}}, {$ref: './components.yaml#/components/parameters/Cursor'}, {$ref: './components.yaml#/components/parameters/Limit'}, {$ref: './components.yaml#/components/parameters/Sort'}]
      responses:
        '200': {description: A page, content: {application/json: {schema: {allOf: [{$ref: './components.yaml#/components/schemas/Page'}, {type: object, properties: {data: {type: array, items: {$ref: './components.yaml#/components/schemas/Lot'}}}}]}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /products/{product_id}/serials:
    get:
      operationId: listSerials
      summary: "Serials of a product with their location"
      tags: [products]
      x-wave: 3
      x-permission: wms.products.read
      security: [{staffCookie: []}]
      parameters: [{name: product_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/Q'}, {$ref: './components.yaml#/components/parameters/Cursor'}, {$ref: './components.yaml#/components/parameters/Limit'}, {$ref: './components.yaml#/components/parameters/Sort'}]
      responses:
        '200': {description: A page, content: {application/json: {schema: {allOf: [{$ref: './components.yaml#/components/schemas/Page'}, {type: object, properties: {data: {type: array, items: {$ref: './components.yaml#/components/schemas/Serial'}}}}]}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /suppliers:
    get:
      operationId: listSuppliers
      summary: "List suppliers"
      tags: [purchasing]
      x-wave: 3
      x-permission: wms.purchase_orders.read
      security: [{staffCookie: []}]
      parameters: [{$ref: './components.yaml#/components/parameters/Q'}, {$ref: './components.yaml#/components/parameters/Cursor'}, {$ref: './components.yaml#/components/parameters/Limit'}, {$ref: './components.yaml#/components/parameters/Sort'}]
      responses:
        '200': {description: A page, content: {application/json: {schema: {allOf: [{$ref: './components.yaml#/components/schemas/Page'}, {type: object, properties: {data: {type: array, items: {$ref: './components.yaml#/components/schemas/Supplier'}}}}]}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
    post:
      operationId: createSupplier
      summary: "Create a supplier"
      tags: [purchasing]
      x-wave: 3
      x-permission: wms.suppliers.manage
      security: [{staffCookie: []}]
      parameters: [{$ref: './components.yaml#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Supplier'}}}}
      responses:
        '201': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Supplier'}}}}
        '400': {$ref: './components.yaml#/components/responses/BadRequest', description: 'Codes: validation_failed.'}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /suppliers/{supplier_id}:
    patch:
      operationId: updateSupplier
      summary: "Change a supplier"
      tags: [purchasing]
      x-wave: 3
      x-permission: wms.suppliers.manage
      security: [{staffCookie: []}]
      parameters: [{name: supplier_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Supplier'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Supplier'}}}}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /purchase-orders:
    get:
      operationId: listPurchaseOrders
      summary: "List purchase orders"
      tags: [purchasing]
      x-wave: 3
      x-permission: wms.purchase_orders.read
      security: [{staffCookie: []}]
      parameters: [{$ref: './components.yaml#/components/parameters/StatusQuery'}, {$ref: './components.yaml#/components/parameters/SiteIdQuery'}, {name: supplier_id, in: query, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/Cursor'}, {$ref: './components.yaml#/components/parameters/Limit'}, {$ref: './components.yaml#/components/parameters/Sort'}]
      responses:
        '200': {description: A page, content: {application/json: {schema: {allOf: [{$ref: './components.yaml#/components/schemas/Page'}, {type: object, properties: {data: {type: array, items: {$ref: './components.yaml#/components/schemas/PurchaseOrder'}}}}]}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
    post:
      operationId: createPurchaseOrder
      summary: "Create a draft purchase order"
      tags: [purchasing]
      x-wave: 3
      x-permission: wms.purchase_orders.manage
      security: [{staffCookie: []}]
      parameters: [{$ref: './components.yaml#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/PurchaseOrder'}}}}
      responses:
        '201': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/PurchaseOrder'}}}}
        '400': {$ref: './components.yaml#/components/responses/BadRequest', description: 'Codes: validation_failed.'}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: site_kind_mismatch, idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /purchase-orders/{purchase_order_id}:
    get:
      operationId: getPurchaseOrder
      summary: "Get a purchase order"
      tags: [purchasing]
      x-wave: 3
      x-permission: wms.purchase_orders.read
      security: [{staffCookie: []}]
      parameters: [{name: purchase_order_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/PurchaseOrder'}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
    patch:
      operationId: updatePurchaseOrder
      summary: "Change a draft purchase order"
      tags: [purchasing]
      x-wave: 3
      x-permission: wms.purchase_orders.manage
      security: [{staffCookie: []}]
      parameters: [{name: purchase_order_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/PurchaseOrder'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/PurchaseOrder'}}}}
        '409': {$ref: './components.yaml#/components/responses/Conflict', description: 'Codes: invalid_transition.'}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /purchase-orders/{purchase_order_id}/send:
    post:
      operationId: sendPurchaseOrder
      summary: "Mark a purchase order sent"
      description: 'draft → sent (§4.3).'
      tags: [purchasing]
      x-wave: 3
      x-permission: wms.purchase_orders.manage
      security: [{staffCookie: []}]
      parameters: [{name: purchase_order_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/PurchaseOrder'}}}}
        '409': {$ref: './components.yaml#/components/responses/Conflict', description: 'Codes: invalid_transition.'}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /purchase-orders/{purchase_order_id}/close:
    post:
      operationId: closePurchaseOrder
      summary: "Close a purchase order"
      tags: [purchasing]
      x-wave: 3
      x-permission: wms.purchase_orders.manage
      security: [{staffCookie: []}]
      parameters: [{name: purchase_order_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/PurchaseOrder'}}}}
        '409': {$ref: './components.yaml#/components/responses/Conflict', description: 'Codes: invalid_transition.'}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /purchase-orders/{purchase_order_id}/cancel:
    post:
      operationId: cancelPurchaseOrder
      summary: "Cancel a purchase order"
      tags: [purchasing]
      x-wave: 3
      x-permission: wms.purchase_orders.manage
      security: [{staffCookie: []}]
      parameters: [{name: purchase_order_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WmsReasonRequest'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/PurchaseOrder'}}}}
        '409': {$ref: './components.yaml#/components/responses/Conflict', description: 'Codes: invalid_transition.'}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /receipts:
    get:
      operationId: listReceipts
      summary: "List inbound receipts"
      tags: [receiving]
      x-wave: 3
      x-permission: wms.receipts.read
      security: [{staffCookie: []}]
      parameters: [{$ref: './components.yaml#/components/parameters/StatusQuery'}, {$ref: './components.yaml#/components/parameters/SiteIdQuery'}, {name: purchase_order_id, in: query, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/Cursor'}, {$ref: './components.yaml#/components/parameters/Limit'}, {$ref: './components.yaml#/components/parameters/Sort'}]
      responses:
        '200': {description: A page, content: {application/json: {schema: {allOf: [{$ref: './components.yaml#/components/schemas/Page'}, {type: object, properties: {data: {type: array, items: {$ref: './components.yaml#/components/schemas/InboundReceipt'}}}}]}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
    post:
      operationId: createReceipt
      summary: "Expect a receipt, from a purchase order or blind"
      tags: [receiving]
      x-wave: 3
      x-permission: wms.receipts.write
      security: [{staffCookie: []}]
      parameters: [{$ref: './components.yaml#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateReceiptRequest'}}}}
      responses:
        '201': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/InboundReceipt'}}}}
        '400': {$ref: './components.yaml#/components/responses/BadRequest', description: 'Codes: validation_failed.'}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: site_kind_mismatch, idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /receipts/{receipt_id}:
    get:
      operationId: getReceipt
      summary: "Get a receipt"
      tags: [receiving]
      x-wave: 3
      x-permission: wms.receipts.read
      security: [{staffCookie: []}]
      parameters: [{name: receipt_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/InboundReceipt'}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /receipts/{receipt_id}/lines:
    post:
      operationId: receiveReceiptLine
      summary: "Record a scanned received quantity"
      description: 'expected → receiving on the first scan (§4.11). Movement SUPPLIER → receiving location (W-15); above PO plus tolerance needs approval.'
      tags: [receiving]
      x-wave: 3
      x-permission: wms.receipts.write
      security: [{staffCookie: []}]
      parameters: [{name: receipt_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReceiveLineRequest'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/InboundReceipt'}}}}
        '409': {$ref: './components.yaml#/components/responses/Conflict', description: 'Codes: invalid_transition.'}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: tracking_mode_mismatch, approval_required, idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /receipts/{receipt_id}/approve-over-receipt:
    post:
      operationId: approveOverReceipt
      summary: "Approve receiving above the purchase order tolerance"
      description: 'W-15.'
      tags: [receiving]
      x-wave: 3
      x-permission: wms.receipts.approve
      security: [{staffCookie: []}]
      parameters: [{name: receipt_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WmsReasonRequest'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/InboundReceipt'}}}}
        '403': {$ref: './components.yaml#/components/responses/Forbidden', description: 'Codes: separation_of_duties.'}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /receipts/{receipt_id}/close:
    post:
      operationId: closeReceipt
      summary: "Close receiving"
      description: 'receiving → received. Emits wms.inbound_receipt.received.'
      tags: [receiving]
      x-wave: 3
      x-permission: wms.receipts.write
      security: [{staffCookie: []}]
      parameters: [{name: receipt_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/InboundReceipt'}}}}
        '409': {$ref: './components.yaml#/components/responses/Conflict', description: 'Codes: invalid_transition.'}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /receipts/{receipt_id}/put-away:
    post:
      operationId: putAwayReceipt
      summary: "Move received goods to storage"
