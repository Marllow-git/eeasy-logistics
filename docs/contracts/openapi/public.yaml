openapi: 3.1.0
info:
  title: "eeasy-logistics public API"
  version: 1.0.0
  license: {name: Proprietary, identifier: LicenseRef-Proprietary}
  description: >-
    The integrator surface (wave 4): one static X-API-Key per key, scoped to a permission subset
    (document 4 §3.4, plan owner question 1 default). Delivery orders and tracking in full, webhook
    subscriptions, and the webhook catalogue in the top-level webhooks section. WMS paths are present
    and marked x-availability after-wms-pilot (owner question 2 default). API keys are managed only on
    the staff surface. Conventions, errors and waves: docs/contracts/README.md; webhooks: webhooks.md.
servers:
  - url: /v1/public
security:
  - apiKey: []
tags:
  - {name: reference, description: "Sites, statuses and reason codes"}
  - {name: orders, description: "Orders (§3.1, §3.13)"}
  - {name: tracking, description: "Tracking"}
  - {name: webhooks, description: "Webhook subscriptions (webhooks.md, ADR-0030)"}
  - {name: wms, description: "WMS, after the WMS pilot (owner question 2)"}
  - {name: webhook-events, description: "Events POSTed to subscribers (document 2 §6.3)"}
paths:
  /sites:
    get:
      operationId: publicListSites
      summary: "Dispatching sites of the account (for site_id on create)"
      tags: [reference]
      x-wave: 4
      x-permission: delivery.orders.read
      security: [{apiKey: []}]
      parameters: [{$ref: './components.yaml#/components/parameters/Cursor'}, {$ref: './components.yaml#/components/parameters/Limit'}, {$ref: './components.yaml#/components/parameters/Sort'}]
      responses:
        '200': {description: A page, content: {application/json: {schema: {allOf: [{$ref: './components.yaml#/components/schemas/Page'}, {type: object, properties: {data: {type: array, items: {$ref: './components.yaml#/components/schemas/Site'}}}}]}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /reference/order-statuses:
    get:
      operationId: publicListOrderStatuses
      summary: "Order statuses with Arabic and English labels"
      description: 'The state machine of document 2 §3.13; terminal flags included.'
      tags: [reference]
      x-wave: 4
      x-permission: delivery.orders.read
      security: [{apiKey: []}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/LabelList'}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /reference/reason-codes:
    get:
      operationId: publicListReasonCodes
      summary: "Account reason codes with labels"
      tags: [reference]
      x-wave: 4
      x-permission: delivery.orders.read
      security: [{apiKey: []}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/LabelList'}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /coverage/check:
    post:
      operationId: publicCheckCoverage
      summary: "Is this address covered by own fleet"
      description: 'Read-only computation (ADR-0015); no Idempotency-Key.'
      tags: [orders]
      x-wave: 4
      x-permission: delivery.orders.read
      security: [{apiKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PublicCoverageRequest'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/CoverageCheck'}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /orders:
    post:
      operationId: publicCreateOrder
      summary: "Create an order"
      description: 'source api; source_ref is the integrator reference and is unique per account while the order is open. Outside coverage stays pending with pending_reason (D-3).'
      tags: [orders]
      x-wave: 4
      x-permission: delivery.orders.create
      security: [{apiKey: []}]
      parameters: [{$ref: './components.yaml#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/CreateOrderRequest'}}}}
      responses:
        '201': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Order'}}}}
        '400': {$ref: './components.yaml#/components/responses/BadRequest', description: 'Codes: validation_failed.'}
        '409': {$ref: './components.yaml#/components/responses/Conflict', description: 'Codes: slot_full.'}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: cod_not_allowed, limit_exceeded, site_kind_mismatch, idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
    get:
      operationId: publicListOrders
      summary: "List orders"
      tags: [orders]
      x-wave: 4
      x-permission: delivery.orders.read
      security: [{apiKey: []}]
      parameters: [{$ref: './components.yaml#/components/parameters/StatusQuery'}, {$ref: './components.yaml#/components/parameters/CreatedFrom'}, {$ref: './components.yaml#/components/parameters/CreatedTo'}, {$ref: './components.yaml#/components/parameters/UpdatedFrom'}, {name: source_ref, in: query, schema: {type: string}}, {name: number, in: query, schema: {type: string}}, {$ref: './components.yaml#/components/parameters/Cursor'}, {$ref: './components.yaml#/components/parameters/Limit'}, {$ref: './components.yaml#/components/parameters/Sort'}]
      responses:
        '200': {description: A page, content: {application/json: {schema: {allOf: [{$ref: './components.yaml#/components/schemas/Page'}, {type: object, properties: {data: {type: array, items: {$ref: './components.yaml#/components/schemas/Order'}}}}]}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /orders/{order_id}:
    get:
      operationId: publicGetOrder
      summary: "Get an order"
      tags: [orders]
      x-wave: 4
      x-permission: delivery.orders.read
      security: [{apiKey: []}]
      parameters: [{name: order_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Order'}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /orders/{order_id}/events:
    get:
      operationId: publicListOrderEvents
      summary: "Status history"
      tags: [orders]
      x-wave: 4
      x-permission: delivery.orders.read
      security: [{apiKey: []}]
      parameters: [{name: order_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/Cursor'}, {$ref: './components.yaml#/components/parameters/Limit'}, {$ref: './components.yaml#/components/parameters/Sort'}]
      responses:
        '200': {description: A page, content: {application/json: {schema: {allOf: [{$ref: './components.yaml#/components/schemas/Page'}, {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/PublicOrderEvent'}}}}]}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /orders/{order_id}/cancel:
    post:
      operationId: publicCancelOrder
      summary: "Cancel an order before pickup"
      description: 'pending, accepted, offered or assigned → cancelled (§3.13). After pickup the merchant asks the dispatcher; the order then goes failed → returned.'
      tags: [orders]
      x-wave: 4
      x-permission: delivery.orders.cancel
      security: [{apiKey: []}]
      parameters: [{name: order_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PublicReasonRequest'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Order'}}}}
        '409': {$ref: './components.yaml#/components/responses/Conflict', description: 'Codes: invalid_transition.'}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /orders/{order_id}/tracking:
    get:
      operationId: publicGetTracking
      summary: "Tracking view and the recipient link"
      tags: [tracking]
      x-wave: 4
      x-permission: delivery.orders.read
      security: [{apiKey: []}]
      parameters: [{name: order_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/PublicOrderTracking'}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /orders/{order_id}/label:
    get:
      operationId: publicGetLabel
      summary: "Signed URL for the label PDF"
      tags: [orders]
      x-wave: 4
      x-permission: delivery.orders.read
      security: [{apiKey: []}]
      parameters: [{name: order_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/SignedUrl'}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /labels:
    post:
      operationId: publicBatchLabels
      summary: "One PDF with up to 100 labels"
      description: 'Read-only rendering; no Idempotency-Key. Every order must belong to the key account.'
      tags: [orders]
      x-wave: 4
      x-permission: delivery.orders.read
      security: [{apiKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LabelBatchRequest'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/SignedUrl'}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /orders/{order_id}/proofs:
    get:
      operationId: publicListProofs
      summary: "Proofs of an order"
      tags: [orders]
      x-wave: 4
      x-permission: delivery.proofs.read
      security: [{apiKey: []}]
      parameters: [{name: order_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/Cursor'}, {$ref: './components.yaml#/components/parameters/Limit'}, {$ref: './components.yaml#/components/parameters/Sort'}]
      responses:
        '200': {description: A page, content: {application/json: {schema: {allOf: [{$ref: './components.yaml#/components/schemas/Page'}, {type: object, properties: {data: {type: array, items: {$ref: './components.yaml#/components/schemas/Proof'}}}}]}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /orders/{order_id}/proofs/{proof_id}/download-url:
    get:
      operationId: publicGetProofUrl
      summary: "Expiring signed URL of a stored proof"
      description: 'delivery.proof.stored webhooks carry no URL; integrators fetch it here (document 2 §6.3).'
      tags: [orders]
      x-wave: 4
      x-permission: delivery.proofs.read
      security: [{apiKey: []}]
      parameters: [{name: order_id, in: path, required: true, schema: {type: string, format: uuid}}, {name: proof_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/SignedUrl'}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /webhook-subscriptions:
    get:
      operationId: publicListWebhookSubscriptions
      summary: "List webhook subscriptions"
      tags: [webhooks]
      x-wave: 4
      x-permission: core.webhooks.manage
      security: [{apiKey: []}]
      parameters: [{$ref: './components.yaml#/components/parameters/StatusQuery'}, {$ref: './components.yaml#/components/parameters/Cursor'}, {$ref: './components.yaml#/components/parameters/Limit'}, {$ref: './components.yaml#/components/parameters/Sort'}]
      responses:
        '200': {description: A page, content: {application/json: {schema: {allOf: [{$ref: './components.yaml#/components/schemas/Page'}, {type: object, properties: {data: {type: array, items: {$ref: './components.yaml#/components/schemas/WebhookSubscription'}}}}]}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
    post:
      operationId: publicCreateWebhookSubscription
      summary: "Subscribe a URL to event types; the secret is shown once"
      description: 'Status pending_verification. The URL check and a webhook.verification request with a one-time verification_token go through the outbox; the subscription delivers events only after the verify call (webhooks.md §4, ADR-0030). Scope: each event type needs the matching read permission of the creator (delivery.order.* and delivery.cod.* → delivery.orders.read; delivery.proof.* → delivery.proofs.read; wms.stock.* → wms.stock.read; wms.fulfilment_order.* and wms.package.* → wms.fulfilment.read; wms.inbound_receipt.* and wms.return.* → wms.receipts.read), checked at create, update and every delivery; a missing scope returns 403 forbidden with details.missing_scope. The subscription is paused when the creating key is revoked or loses the scope, or the creating member is revoked.'
      tags: [webhooks]
      x-wave: 4
      x-permission: core.webhooks.manage
      security: [{apiKey: []}]
      parameters: [{$ref: './components.yaml#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/WebhookSubscriptionInput'}}}}
      responses:
        '201': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/WebhookSubscriptionCreated'}}}}
        '400': {$ref: './components.yaml#/components/responses/BadRequest', description: 'Codes: validation_failed.'}
        '403': {$ref: './components.yaml#/components/responses/Forbidden', description: 'Codes: forbidden.'}
        '409': {$ref: './components.yaml#/components/responses/Conflict', description: 'Codes: secret_already_issued.'}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: webhook_url_invalid, limit_exceeded, idempotency_key_reused.'}
        '429': {$ref: './components.yaml#/components/responses/TooManyRequests', description: 'Codes: rate_limited.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /webhook-subscriptions/{subscription_id}:
    get:
      operationId: publicGetWebhookSubscription
      summary: "Get a subscription"
      tags: [webhooks]
      x-wave: 4
      x-permission: core.webhooks.manage
      security: [{apiKey: []}]
      parameters: [{name: subscription_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/WebhookSubscription'}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
    patch:
      operationId: publicUpdateWebhookSubscription
      summary: "Change URL, event types or pause"
      description: 'A URL change returns the subscription to pending_verification. Scope: each event type needs the matching read permission of the creator (delivery.order.* and delivery.cod.* → delivery.orders.read; delivery.proof.* → delivery.proofs.read; wms.stock.* → wms.stock.read; wms.fulfilment_order.* and wms.package.* → wms.fulfilment.read; wms.inbound_receipt.* and wms.return.* → wms.receipts.read), checked at create, update and every delivery; a missing scope returns 403 forbidden with details.missing_scope. The subscription is paused when the creating key is revoked or loses the scope, or the creating member is revoked. Resuming a paused subscription (status active) rebinds created_by_key_id or created_by_membership_id to the resuming principal, whose scopes are then checked for every event type.'
      tags: [webhooks]
      x-wave: 4
      x-permission: core.webhooks.manage
      security: [{apiKey: []}]
      parameters: [{name: subscription_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/WebhookSubscriptionInput'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/WebhookSubscription'}}}}
        '403': {$ref: './components.yaml#/components/responses/Forbidden', description: 'Codes: forbidden.'}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: webhook_url_invalid, idempotency_key_reused.'}
        '429': {$ref: './components.yaml#/components/responses/TooManyRequests', description: 'Codes: rate_limited.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
    delete:
      operationId: publicDeleteWebhookSubscription
      summary: "Delete a subscription"
      tags: [webhooks]
      x-wave: 4
      x-permission: core.webhooks.manage
      security: [{apiKey: []}]
      parameters: [{name: subscription_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}]
      responses:
        '204': {description: Done}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /webhook-subscriptions/{subscription_id}/verify:
    post:
      operationId: publicVerifyWebhookSubscription
      summary: "Prove control of the URL with the verification token"
      tags: [webhooks]
      x-wave: 4
      x-permission: core.webhooks.manage
      security: [{apiKey: []}]
      parameters: [{name: subscription_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/WebhookVerifyRequest'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/WebhookSubscription'}}}}
        '409': {$ref: './components.yaml#/components/responses/Conflict', description: 'Codes: invalid_transition.'}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: verification_token_invalid, idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /webhook-subscriptions/{subscription_id}/rotate-secret:
    post:
      operationId: publicRotateWebhookSecret
      summary: "Issue a new signing secret; the old one stays valid 24 h"
      description: 'Both secrets sign for 24 h. A replay returns 409 secret_already_issued; the secret is never stored in the idempotency store.'
      tags: [webhooks]
      x-wave: 4
      x-permission: core.webhooks.manage
      security: [{apiKey: []}]
      parameters: [{name: subscription_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}]
      responses:
        '201': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/WebhookSubscriptionCreated'}}}}
        '409': {$ref: './components.yaml#/components/responses/Conflict', description: 'Codes: secret_already_issued.'}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /webhook-subscriptions/{subscription_id}/test-deliveries:
    post:
      operationId: publicSendTestWebhook
      summary: "Send a signed sample event now"
      description: 'Sample payload from the catalogue, marked test: true; not counted in delivery statistics.'
      tags: [webhooks]
      x-wave: 4
      x-permission: core.webhooks.manage
      security: [{apiKey: []}]
      parameters: [{name: subscription_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/WebhookTestRequest'}}}}
      responses:
        '202': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/WebhookDelivery'}}}}
        '409': {$ref: './components.yaml#/components/responses/Conflict', description: 'Codes: invalid_transition.'}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /webhook-subscriptions/{subscription_id}/deliveries:
    get:
      operationId: publicListWebhookDeliveries
      summary: "Delivery log, including dead-lettered deliveries"
      tags: [webhooks]
      x-wave: 4
      x-permission: core.webhooks.manage
      security: [{apiKey: []}]
      parameters: [{name: subscription_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/StatusQuery'}, {$ref: './components.yaml#/components/parameters/CreatedFrom'}, {$ref: './components.yaml#/components/parameters/CreatedTo'}, {$ref: './components.yaml#/components/parameters/Cursor'}, {$ref: './components.yaml#/components/parameters/Limit'}, {$ref: './components.yaml#/components/parameters/Sort'}]
      responses:
        '200': {description: A page, content: {application/json: {schema: {allOf: [{$ref: './components.yaml#/components/schemas/Page'}, {type: object, properties: {data: {type: array, items: {$ref: './components.yaml#/components/schemas/WebhookDelivery'}}}}]}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /webhook-subscriptions/{subscription_id}/deliveries/{delivery_id}/redeliver:
    post:
      operationId: publicRedeliverWebhook
      summary: "Redeliver one delivery, including a dead one"
      tags: [webhooks]
      x-wave: 4
      x-permission: core.webhooks.manage
      security: [{apiKey: []}]
      parameters: [{name: subscription_id, in: path, required: true, schema: {type: string, format: uuid}}, {name: delivery_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {description: OK, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/WebhookDelivery'}}}}
        '422': {$ref: './components.yaml#/components/responses/Unprocessable', description: 'Codes: idempotency_key_reused.'}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /webhook-event-types:
    get:
      operationId: publicListWebhookEventTypes
      summary: "Webhook catalogue with versions and sample payloads"
      tags: [webhooks]
      x-wave: 4
      x-permission: core.webhooks.manage
      security: [{apiKey: []}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/WebhookEventTypeList'}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /products:
    get:
      operationId: publicListProducts
      summary: "List products"
      tags: [wms]
      x-wave: 4
      x-permission: wms.products.read
      x-availability: after-wms-pilot
      security: [{apiKey: []}]
      parameters: [{name: sku, in: query, schema: {type: string}}, {$ref: './components.yaml#/components/parameters/Q'}, {$ref: './components.yaml#/components/parameters/Cursor'}, {$ref: './components.yaml#/components/parameters/Limit'}, {$ref: './components.yaml#/components/parameters/Sort'}]
      responses:
        '200': {description: A page, content: {application/json: {schema: {allOf: [{$ref: './components.yaml#/components/schemas/Page'}, {type: object, properties: {data: {type: array, items: {$ref: './components.yaml#/components/schemas/Product'}}}}]}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /stock-summaries:
    get:
      operationId: publicListStock
      summary: "Available quantity per product"
      tags: [wms]
      x-wave: 4
      x-permission: wms.stock.read
      x-availability: after-wms-pilot
      security: [{apiKey: []}]
      parameters: [{name: product_id, in: query, schema: {type: string, format: uuid}}, {$ref: './components.yaml#/components/parameters/Cursor'}, {$ref: './components.yaml#/components/parameters/Limit'}, {$ref: './components.yaml#/components/parameters/Sort'}]
      responses:
        '200': {description: A page, content: {application/json: {schema: {allOf: [{$ref: './components.yaml#/components/schemas/Page'}, {type: object, properties: {data: {type: array, items: {$ref: './components.yaml#/components/schemas/StockSummary'}}}}]}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
  /fulfilment-orders:
    get:
      operationId: publicListFulfilmentOrders
      summary: "List fulfilment orders"
      tags: [wms]
      x-wave: 4
      x-permission: wms.fulfilment.read
      x-availability: after-wms-pilot
      security: [{apiKey: []}]
      parameters: [{$ref: './components.yaml#/components/parameters/StatusQuery'}, {name: source_ref, in: query, schema: {type: string}}, {$ref: './components.yaml#/components/parameters/Cursor'}, {$ref: './components.yaml#/components/parameters/Limit'}, {$ref: './components.yaml#/components/parameters/Sort'}]
      responses:
        '200': {description: A page, content: {application/json: {schema: {allOf: [{$ref: './components.yaml#/components/schemas/Page'}, {type: object, properties: {data: {type: array, items: {$ref: './components.yaml#/components/schemas/FulfilmentOrder'}}}}]}}}}
        '4XX': {$ref: './components.yaml#/components/responses/ClientError'}
    post:
