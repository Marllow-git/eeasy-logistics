components:
  parameters:
    XEeasySignature:
      name: X-Eeasy-Signature
      in: header
      required: true
      description: 'v1=<hex HMAC-SHA256 of "<timestamp>.<raw body>"> with the subscription secret; two values during a secret rotation (ADR-0030)'
      schema: {type: string}
    XEeasyTimestamp:
      name: X-Eeasy-Timestamp
      in: header
      required: true
      description: Unix seconds; reject when more than 300 s from now
      schema: {type: integer}
  securitySchemes:
    apiKey: {$ref: './components.yaml#/components/securitySchemes/apiKey'}
  schemas:

    WebhookEventTypeList:
      type: object
      properties:
        data:
          type: array
          items: {type: object, properties: {type: {type: string}, version: {type: integer}, description_ar: {type: string}, description_en: {type: string}, sample: {$ref: './components.yaml#/components/schemas/Envelope'}}}

    LabelList:
      type: object
      properties:
        data: {type: array, items: {type: object, properties: {key: {type: string}, label_ar: {type: string}, label_en: {type: string}, terminal: {type: boolean}}}}
    PublicCoverageRequest:
      type: object
      properties:
        address: {$ref: './components.yaml#/components/schemas/Address'}
        point: {$ref: './components.yaml#/components/schemas/Point'}
    PublicOrderEvent:
      type: object
      description: The integrator view of an order event; actor ids are not exposed.
      properties:
        status: {$ref: './components.yaml#/components/schemas/OrderStatus'}
        at: {type: string, format: date-time}
        reason_code: {type: [string, 'null']}
        attempt_number: {type: [integer, 'null']}
    PublicReasonRequest:
      type: object
      required: [reason_code]
      properties: {reason_code: {type: string}, note: {type: string, maxLength: 1000}}
    PublicOrderTracking:
      type: object
      properties:
        view: {$ref: './components.yaml#/components/schemas/PublicTrackingView'}
        tracking_url: {type: string, format: uri}
    LabelBatchRequest:
      type: object
      required: [order_ids]
      properties: {order_ids: {type: array, minItems: 1, maxItems: 100, items: {type: string, format: uuid}}, size: {type: string, enum: [a6, label_10x15], default: label_10x15}}
    PublicFulfilmentOrderRequest:
      type: object
      required: [site_id, recipient, address, lines]
      properties:
        site_id: {type: string, format: uuid}
        source_ref: {type: string}
        recipient: {$ref: './components.yaml#/components/schemas/Recipient'}
        address: {$ref: './components.yaml#/components/schemas/Address'}
        cod_amount: {$ref: './components.yaml#/components/schemas/Money'}
        lines: {type: array, minItems: 1, items: {type: object, required: [product_id, quantity], properties: {product_id: {type: string, format: uuid}, quantity: {type: integer, minimum: 1}}}}

    WhOrder:
      type: object
      description: Common order block of every delivery.order.* payload.
      required: [id, number, kind, status, version]
      properties:
        id: {type: string, format: uuid}
        number: {type: string}
        kind: {$ref: './components.yaml#/components/schemas/OrderKind'}
        status: {$ref: './components.yaml#/components/schemas/OrderStatus'}
        source_ref: {type: [string, 'null']}
        site_id: {type: string, format: uuid}
        cod_amount: {$ref: './components.yaml#/components/schemas/Money'}
        version: {type: integer}
    WhDriver:
      type: object
      properties: {id: {type: string, format: uuid}, first_name: {type: string}}
    WhLines:
      type: array
      items: {type: object, properties: {product_id: {type: string, format: uuid}, sku: {type: string}, quantity: {type: integer}, condition: {type: string}, expected: {type: integer}, received: {type: integer}, damaged: {type: integer}}}
    DeliveryOrderCreated:
      type: object
      description: Payload of delivery.order.created version 1.
      properties:
        order: {$ref: '#/components/schemas/WhOrder'}
        source: {type: string, enum: [manual, csv, api, channel, wms_package]}
        recipient: {$ref: './components.yaml#/components/schemas/Recipient'}
        address: {$ref: './components.yaml#/components/schemas/Address'}
    DeliveryOrderAccepted:
      type: object
      description: Payload of delivery.order.accepted version 1.
      properties:
        order: {$ref: '#/components/schemas/WhOrder'}
        zone_id: {type: string, format: uuid}
        slot: {type: [object, 'null'], properties: {starts_at: {type: string, format: date-time}, ends_at: {type: string, format: date-time}}}
    DeliveryOrderAssigned:
      type: object
      description: Payload of delivery.order.assigned version 1.
      properties:
        order: {$ref: '#/components/schemas/WhOrder'}
        driver: {$ref: '#/components/schemas/WhDriver'}
        vehicle_kind: {type: string, enum: [car, van, motorbike]}
    DeliveryOrderPickedUp:
      type: object
      description: Payload of delivery.order.picked_up version 1.
      properties:
        order: {$ref: '#/components/schemas/WhOrder'}
        driver: {$ref: '#/components/schemas/WhDriver'}
        picked_up_at: {type: string, format: date-time}
    DeliveryOrderOutForDelivery:
      type: object
      description: Payload of delivery.order.out_for_delivery version 1.
      properties:
        order: {$ref: '#/components/schemas/WhOrder'}
        eta: {type: [string, 'null'], format: date-time}
        tracking_url: {type: string, format: uri}
    DeliveryOrderAttempted:
      type: object
      description: Payload of delivery.order.attempted version 1.
      properties:
        order: {$ref: '#/components/schemas/WhOrder'}
        attempt_number: {type: integer}
        reason_code: {type: string}
        attempted_at: {type: string, format: date-time}
    DeliveryOrderDelivered:
      type: object
      description: Payload of delivery.order.delivered version 1.
      properties:
        order: {$ref: '#/components/schemas/WhOrder'}
        delivered_at: {type: string, format: date-time}
        point: {$ref: './components.yaml#/components/schemas/Point'}
        proof_ids: {type: array, items: {type: string, format: uuid}}
        cod: {type: object, properties: {amount: {$ref: './components.yaml#/components/schemas/Money'}, collections: {type: array, items: {type: object, properties: {method: {type: string, enum: [cash, card, mada, wallet]}, amount: {$ref: './components.yaml#/components/schemas/Money'}}}}}}
    DeliveryOrderFailed:
      type: object
      description: Payload of delivery.order.failed version 1.
      properties:
        order: {$ref: '#/components/schemas/WhOrder'}
        reason_code: {type: string}
    DeliveryOrderReturned:
      type: object
      description: Payload of delivery.order.returned version 1.
      properties:
        order: {$ref: '#/components/schemas/WhOrder'}
        returned_at: {type: string, format: date-time}
        items: {type: array, items: {type: object, properties: {sku: {type: string}, quantity: {type: integer}}}}
    DeliveryOrderCancelled:
      type: object
      description: Payload of delivery.order.cancelled version 1.
      properties:
        order: {$ref: '#/components/schemas/WhOrder'}
        reason_code: {type: string}
        actor_type: {type: string, enum: [user, api_key, system]}
    DeliveryOrderRescheduled:
