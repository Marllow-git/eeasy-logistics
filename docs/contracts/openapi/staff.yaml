components:
  securitySchemes:
    staffCookie: {$ref: './components.yaml#/components/securitySchemes/staffCookie'}
  schemas:

    AcceptInvitationRequest:
      type: object
      required: [token, name, password]
      properties:
        token: {type: string}
        name: {type: string}
        password: {type: string, minLength: 12, maxLength: 256, description: Argon2id; breached-password check (document 4 §3.1)}
        locale: {type: string, enum: [ar, en]}
    LoginRequest:
      type: object
      required: [email, password]
      properties: {email: {type: string, format: email}, password: {type: string, maxLength: 256}}
    LoginResponse:
      type: object
      properties:
        second_factor_required: {type: boolean}
        challenge_id: {type: [string, 'null']}
        account_selection_required: {type: boolean}
        selection_token: {type: [string, 'null'], description: 'Single use, 5 minutes; only with account_selection_required'}
        memberships:
          type: array
          description: 'Only with account_selection_required, and only after every factor required by any of the user''s accounts has passed (N1)'
          items: {type: object, properties: {membership_id: {type: string, format: uuid}, account_id: {type: string, format: uuid}, account_name: {type: string}, roles: {type: array, items: {$ref: './components.yaml#/components/schemas/Role'}}}}
        enrolment_required: {type: boolean, description: A required second factor is not enrolled}
        enrolment_token: {type: [string, 'null'], description: 'Enrolment-only, 10 minutes; usable only on second-factor/enrol and /confirm (N2)'}
        me: {oneOf: [{$ref: './components.yaml#/components/schemas/Me'}, {type: 'null'}]}
    SelectAccountRequest:
      type: object
      required: [selection_token, membership_id]
      properties: {selection_token: {type: string}, membership_id: {type: string, format: uuid}}
    SwitchAccountRequest:
      type: object
      required: [membership_id]
      properties: {membership_id: {type: string, format: uuid}}
    EnrolSecondFactorRequest:
      type: object
      required: [enrolment_token, phone]
      properties: {enrolment_token: {type: string}, phone: {type: string, description: Normalised to E.164}}
    EnrolConfirmRequest:
      type: object
      required: [enrolment_token, challenge_id, code]
      properties: {enrolment_token: {type: string}, challenge_id: {type: string}, code: {type: string, pattern: '^[0-9]{6}$'}}
    RedeemEnrolmentLinkRequest:
      type: object
      required: [link_token, password]
      properties: {link_token: {type: string}, password: {type: string, maxLength: 256}}
    EnrolmentToken:
      type: object
      properties: {enrolment_token: {type: string}, expires_at: {type: string, format: date-time}}
    MemberResetRequest:
      type: object
      required: [reason]
      properties: {reason: {type: string, minLength: 5, maxLength: 500}}
    EnrolChallenge:
      type: object
      properties: {challenge_id: {type: string}, expires_at: {type: string, format: date-time}}
    ChallengeRequest:
      type: object
      required: [challenge_id]
      properties: {challenge_id: {type: string}}
    ChallengeVerifyRequest:
      type: object
      required: [challenge_id, code]
      properties: {challenge_id: {type: string}, code: {type: string, pattern: '^[0-9]{6}$'}}
    PasswordResetRequest:
      type: object
      required: [email]
      properties: {email: {type: string, format: email}}
    PasswordResetConfirm:
      type: object
      required: [token, password]
      properties: {token: {type: string}, password: {type: string, minLength: 12, maxLength: 256}}
    InviteMemberRequest:
      type: object
      required: [email, name, roles]
      properties:
        email: {type: string, format: email}
        name: {type: string}
        roles: {type: array, minItems: 1, items: {$ref: './components.yaml#/components/schemas/StaffRole'}}
        site_ids: {type: array, items: {type: string, format: uuid}}
    UpdateMemberRequest:
      type: object
      properties:
        roles: {type: array, minItems: 1, items: {$ref: './components.yaml#/components/schemas/StaffRole'}}
        site_ids: {type: array, items: {type: string, format: uuid}}
    CreateChannelConnectionRequest:
      type: object
      required: [provider]
      properties:
        provider: {type: string, enum: [salla, zid, eeasy_shipping]}
        api_key: {type: string, writeOnly: true, maxLength: 512, description: eeasy_shipping only}
        name: {type: string, maxLength: 100}
      allOf:
        - if: {properties: {provider: {const: eeasy_shipping}}, required: [provider]}
          then: {required: [api_key], properties: {api_key: {type: string}}}
    ChannelConnectionCreated:
      type: object
      properties:
        connection: {$ref: './components.yaml#/components/schemas/ChannelConnection'}
        authorize_url: {type: [string, 'null'], format: uri, description: Salla and Zid only; single use}
    CreateApiKeyRequest:
      type: object
      required: [name, scopes]
      properties:
        name: {type: string}
        scopes: {type: array, minItems: 1, items: {type: string, enum: [delivery.orders.read, delivery.orders.create, delivery.orders.cancel, delivery.proofs.read, core.webhooks.manage, wms.products.read, wms.stock.read, wms.receipts.read, wms.fulfilment.read, wms.fulfilment.manage]}}
    RotateApiKeyRequest:
      type: object
      properties: {overlap_hours: {type: integer, minimum: 0, maximum: 168, default: 24}}

    WebhookEventTypeList:
      type: object
      properties:
        data:
          type: array
          items: {type: object, properties: {type: {type: string}, version: {type: integer}, description_ar: {type: string}, description_en: {type: string}, sample: {$ref: './components.yaml#/components/schemas/Envelope'}}}
