# Role bundles (README §11 "Role bundles", document 4 §2), one entry per role, every permission
# spelled out (no wildcards). PLAT-10 plan 2.1:
# - `scope`: `account` (merchant roles, driver) or `platform` (platform staff).
# - `surface`: the API surface whose tokens may carry the role (`staff`, `driver`, `platform`); a
#   bundle counts only on its own surface.
# - `site_scoped`: true for the roles restricted to the membership's `site_ids` (site staff,
#   warehouse staff, cashier); their permissions act only on those sites.
# - `permissions`: members of permissions.yaml (lint rule eeasy/role-permissions-in-catalogue). The
#   doors `core.auth.anonymous`, `core.auth.self` and `platform.auth.self` are never listed: the
#   permission guard opens them to any principal of the surface, not by role.
# A test in packages/contracts keeps this file equal to README §11; migration 0008 (apps/api)
# seeds core_roles from it, and a test there keeps the seed equal to this file. Change README §11,
# this file and a re-seed migration together.
roles:
  owner:
    scope: account
    surface: staff
    site_scoped: false
    permissions:
      - core.account.read
      - core.account.manage
      - core.members.read
