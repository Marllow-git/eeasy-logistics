packages:
  - apps/*
  - packages/*

# pnpm 10 runs no dependency install scripts unless the package is listed here.
onlyBuiltDependencies:
  - esbuild

# Install scripts deliberately not run: these ship prebuilt binaries through optional dependencies.
ignoredBuiltDependencies:
  - '@parcel/watcher'
  # The API's `nest build` compiler (CHORE-1). Its postinstall checks the native binary and,
  # failing that, runs `npm install @swc/wasm`; the binary comes as an optional dependency.
  - '@swc/core'
  - unrs-resolver
  # Its postinstall would write the hook; the root `prepare` script does that explicitly (PLAT-3).
  - simple-git-hooks

# Supply chain: refuse versions published less than three days ago (minutes), and fail an
# install when a package's publish trust level drops below an earlier release's (for example,
# provenance disappears). A version needed sooner goes in minimumReleaseAgeExclude, with a reason.
minimumReleaseAge: 4320
trustPolicy: no-downgrade
# Trust is only checked for versions published in the last 30 days (minutes). A takeover shows up
# as a fresh release; older versions published before provenance existed (e.g. undici-types 6.21.0)
# otherwise fail as false downgrades whenever the lockfile is re-resolved.
trustPolicyIgnoreAfter: 43200

# Accepted advisories, reviewed 2026-11-01. Each sits in build or test tooling (jest, eslint,
# @expo/cli, drizzle-kit) and never reaches an API image or a web or app bundle. Forcing the
# patched versions would cross major versions under those tools. Re-review when they update.
auditConfig:
  ignoreGhsas:
    - GHSA-67mh-4wv8-2f99 # esbuild <=0.24.2 dev-server CORS; via drizzle-kit, never serves
    - GHSA-g3hv-75wg-m249 # minimatch ReDoS; via jest, eslint and @expo/cli, patterns are ours
    - GHSA-3g3m-2fjr-6pw4 # glob AbortSignal bypass; via jest and @expo/cli, no untrusted input
    - GHSA-gcqx-w48m-w2h4 # deepmerge prototype poisoning; via jest-config, no fix published

# Versions younger than minimumReleaseAge, accepted with a reason (DRV-1, 2026-11-02): the Expo
# SDK 58 patch train of 2026-10-31 that the lockfile already pinned (expo 58.0.22 and its own
# packages) is re-resolved when the driver app adds its native modules. Remove after 2026-11-04.
minimumReleaseAgeExclude:
  - '@expo/log-box@58.0.14'
  - '@expo/metro-runtime@58.0.16'
  - '@expo/config@58.0.10'
  - 'expo@58.0.22'
  - 'expo-router@58.0.29'
  - 'expo-sqlite@58.0.15'
  - 'expo-dev-client@58.0.18'
  - 'expo-updates@58.0.20'
  - 'expo-dev-launcher@58.0.18'
  - '@expo/schema-utils@58.0.3'
